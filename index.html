.stText{flex:none;background:#fff;border-radius:24px;padding:12px 18px;box-shadow:0 6px 0 rgba(34,48,77,.1);font-size:clamp(19px,2.6vw,30px);line-height:1.35;font-family:var(--display);text-align:center;min-height:2.6em}
.stText .w{border-radius:8px;padding:0 2px;transition:background .12s}.stText .w.on{background:#FFE680}
.stText .l2{display:block;color:var(--pink);font-size:.7em;margin-top:4px}
.stNav{display:flex;justify-content:center;align-items:center;gap:12px;flex:none}
.stNav .round{width:60px;height:60px;font-size:28px}
.stDots{display:flex;gap:5px;align-items:center;padding:0 6px}.stDots i{width:10px;height:10px;border-radius:50%;background:rgba(34,48,77,.18)}.stDots i.on{background:var(--yellow);transform:scale(1.4)}.stDots i.done{background:var(--green)}
.stHelp{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:5;background:rgba(255,255,255,.95);border-radius:999px;padding:8px 18px;font-size:clamp(16px,2.2vw,22px);box-shadow:0 6px 0 rgba(0,0,0,.1);white-space:nowrap;animation:popin .4s cubic-bezier(.3,1.6,.5,1)}
.stChoice{position:absolute;inset:auto 0 16px 0;z-index:5;display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.stCh{height:70px;padding:0 22px;border-radius:24px;font-family:var(--display);font-size:clamp(18px,2.4vw,24px);display:flex;align-items:center;gap:10px}.stCh .emo{font-size:36px}
.stEnd{position:absolute;inset:0;z-index:6;background:rgba(255,255,255,.72);backdrop-filter:blur(4px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;animation:popin .5s}
.stEnd>.emo{font-size:min(22vh,30vw)}.stEnd b{font-family:var(--display);font-size:clamp(34px,6vw,64px)}.stEnd .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.stLibTop{display:flex;align-items:baseline;gap:12px;margin:6px 0 12px}.stLibTop b{font-family:var(--display);font-size:clamp(24px,3.4vw,34px)}.stLibTop small{color:var(--ink2)}
.stLib{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(170px,20vw,230px),1fr));gap:16px;padding-bottom:30px}
.stBook{background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 7px 0 rgba(34,48,77,.12),0 14px 22px rgba(34,48,77,.1);display:flex;flex-direction:column;position:relative}
.stBook.read::after{content:"⭐";position:absolute;top:8px;right:10px;font-family:var(--emoji);font-size:22px}
.stCover{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));color:#fff;padding:18px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.stCover .emo{font-size:clamp(56px,8vw,78px);filter:drop-shadow(0 8px 6px rgba(0,0,0,.2))}.stCover b{font-family:var(--display);font-size:clamp(18px,2.2vw,22px);line-height:1.1;text-shadow:0 2px 0 rgba(0,0,0,.15)}.stCover small{opacity:.9}
.stBtns{display:flex;gap:8px;padding:10px}.stBtns .toy{flex:1;height:48px;border-radius:16px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}

/* ===== Music Studio additions ===== */
#s-music{gap:6px}
.muMain{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.muMain #kb{flex:1;max-height:none}
.muInfo{font-family:var(--display);font-size:18px;color:var(--ink2);padding:0 8px;white-space:nowrap}
#kb.babykb{padding:12px}
#kb .wk.baby{background:linear-gradient(color-mix(in srgb,var(--kc) 30%,#fff),#fff);border-radius:0 0 26px 26px;gap:10px;box-shadow:inset 0 -12px 0 color-mix(in srgb,var(--kc) 45%,#fff)}
#kb .wk.baby .emo{font-size:clamp(34px,6vw,64px)}#kb .wk.baby b{font-size:clamp(16px,2.4vw,24px);color:var(--ink)}
.echoPads{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,2vw,20px);min-height:0}
.echoPad{background:var(--c);border-radius:30px;display:flex;align-items:center;justify-content:center;font-size:clamp(44px,8vw,86px);box-shadow:0 8px 0 rgba(0,0,0,.2),inset 0 -10px 0 rgba(0,0,0,.1);transition:transform .08s,filter .08s}
.echoPad.lit{transform:scale(.94);filter:brightness(1.45) drop-shadow(0 0 30px #fff)}
.fallLane{position:relative;flex:1;min-height:120px;border-radius:22px;background:linear-gradient(#1A1F4D,#39408F);overflow:hidden}
.fallLine{position:absolute;left:0;right:0;top:90%;height:4px;background:rgba(255,255,255,.7);box-shadow:0 0 18px #fff}
.fnote{position:absolute;transform:translate(-50%,-50%);width:clamp(40px,5vw,60px);height:clamp(40px,5vw,60px);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--display);font-size:18px;box-shadow:0 0 14px rgba(255,255,255,.6);transition:transform .2s}
.fnote.now{transform:translate(-50%,-50%) scale(1.25);box-shadow:0 0 30px #fff}.fnote.hit{transform:translate(-50%,-50%) scale(2);opacity:0;transition:.3s}
.kbHost{flex:1.3;min-height:0;display:flex}.kbHost #kb{flex:1}
.bmGrid{flex:1;display:flex;flex-direction:column;gap:6px;min-height:0;background:#22304D;border-radius:22px;padding:10px}
.bmRow{flex:1;display:flex;gap:6px;min-height:0;align-items:stretch}
.bmIco{width:44px;display:flex;align-items:center;justify-content:center;font-size:28px}
.bmCell{flex:1;border-radius:12px;background:rgba(255,255,255,.12);transition:transform .08s,background .1s}
.bmCell.bar{background:rgba(255,255,255,.2)}.bmCell.on{background:var(--c);box-shadow:0 0 12px var(--c)}
.bmCell.play{outline:3px solid #fff;transform:scale(1.06)}
.recBar{display:flex;align-items:center;gap:12px;flex:none}.recBar .round{width:60px;height:60px;font-size:28px}.recBar button[disabled]{opacity:.4}
.choice.gs .emo{font-size:clamp(60px,10vw,110px)}

/* ===== 3D Island ===== */
.isStage{position:relative;flex:1;min-height:0;border-radius:28px;overflow:hidden;background:linear-gradient(#9ED6FF,#E8F7FF);box-shadow:0 10px 26px rgba(34,48,77,.18);touch-action:none}
.isStage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;touch-action:none}
.isLoad{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-size:22px;color:var(--ink);text-align:center;padding:20px}
.isLoad .emo{font-size:90px;animation:dsBob 2s ease-in-out infinite}
.isHud{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3;pointer-events:none}
.isHud span{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:28px;filter:grayscale(1) opacity(.5);box-shadow:0 4px 0 rgba(0,0,0,.1)}
.isHud span.got{filter:none;background:#FFF3B0;animation:popin .4s cubic-bezier(.3,1.6,.5,1)}
body[data-screen=island] #caption{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 86px)}

/* Play World: animals move on the GPU; a baked shadow replaces the costly per-frame drop-shadow filter */
#actors .actor{left:0;top:0;transition:translate 1.5s ease-in-out;filter:none;will-change:translate}
#actors .actor.held{transition:none;filter:none}
#actors .actor::after{content:"";position:absolute;left:15%;right:15%;bottom:-4%;height:12%;border-radius:50%;background:rgba(0,0,0,.18);z-index:-1}
#actors .actor.held::after{transform:scale(.7);opacity:.6}

/* ===== Home + All games ===== */
.hero{align-items:flex-end}
.allBtn{display:flex;align-items:center;gap:10px;height:62px;padding:0 20px;border-radius:22px;flex:none}
.allBtn .emo{font-size:30px}.allBtn b{font-family:var(--display);font-size:clamp(18px,2.2vw,24px)}.allBtn small{background:rgba(255,255,255,.22);border-radius:999px;padding:2px 10px;font-size:14px}
.homeSec{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:clamp(20px,2.8vw,28px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.18),0 6px 16px rgba(0,0,0,.2);margin:14px 0 8px}
.qrow{display:flex;gap:clamp(10px,1.6vw,16px);overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none;scroll-snap-type:x proximity}.qrow::-webkit-scrollbar{display:none}
.qtile{flex:none;scroll-snap-align:start;width:clamp(118px,15vw,160px);aspect-ratio:1/1.02;border-radius:28px;background:linear-gradient(180deg,#fff 58%,color-mix(in srgb,var(--c) 18%,#fff));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;text-align:center;box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--c) 50%,transparent),0 7px 0 rgba(34,48,77,.14),0 12px 22px rgba(34,48,77,.12);position:relative;transition:transform .12s}
.qtile:active{transform:scale(.94)}
.qtile .emo{font-size:clamp(44px,6vw,62px);filter:drop-shadow(0 6px 4px rgba(0,0,0,.14))}
.qtile b{font-family:var(--display);font-size:clamp(14px,1.7vw,18px);line-height:1.05}
.qtile small{font-size:12px;color:var(--ink2);line-height:1.1}
.qtile.new::before{content:"NEW";position:absolute;top:8px;right:10px;background:var(--red);color:#fff;font:900 11px var(--body);border-radius:999px;padding:2px 7px;letter-spacing:.05em}
.agSearch{display:flex;align-items:center;gap:10px;background:#fff;border-radius:22px;padding:6px 16px;box-shadow:0 5px 0 rgba(34,48,77,.1);margin:6px 0 4px}
.agSearch .emo{font-size:26px}.agSearch input{flex:1;border:0;outline:0;height:48px;font-size:20px;background:none;color:var(--ink)}
.agCount{font-family:var(--display);color:var(--ink2);margin:2px 0 8px}
.agGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(118px,15vw,160px),1fr));gap:clamp(10px,1.6vw,16px);padding-bottom:30px}
.agGrid .qtile{width:auto}
/* real paleoart */
.dinoReal{width:100%;aspect-ratio:4/3;object-fit:contain;display:block;border-radius:16px;background:radial-gradient(circle at 50% 60%,#fff,#EEF4F8)}
.dcardD .dinoReal{mix-blend-mode:multiply}
.dinoReal.big{aspect-ratio:auto;max-height:52vh;object-fit:contain;background:#fff;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px;box-sizing:border-box}
.dsArt.hasReal{animation:none}
.dsCredit{display:block;text-align:center;font-size:12px;color:var(--ink2);margin-top:6px;font-weight:700}
.credBtn{margin-left:10px;height:34px;padding:0 12px;border-radius:12px;background:#fff;font-size:14px;box-shadow:0 3px 0 rgba(34,48,77,.12)}
.credits{font-size:14px;line-height:1.5;padding-left:18px;max-height:50vh;overflow:auto}.credits a{color:var(--blue)}
.choice.dq .dinoReal{aspect-ratio:4/3;max-height:26vh;mix-blend-mode:multiply;background:transparent}
.qPrompt{box-sizing:border-box;max-width:100%}

/* Wonder World — storybook theme: warm paper, ink outlines, solid toy shadows. Loaded last; it restyles the shell
   (bar, home, worlds, game cards, shared prompts and pop-ups) so every screen speaks one visual language. */
:root{
  --paper:#FFF7EA;--paper2:#F6E9D2;--ink:#2B2340;--ink2:#6B6182;--line:#2B2340;
  --bw:3px;--hard:0 5px 0 var(--line);--hardP:0 1px 0 var(--line);--r:22px;
}
body{background-color:var(--paper);background-image:radial-gradient(rgba(43,35,64,.07) 1.2px,transparent 1.3px);background-size:22px 22px;color:var(--ink)}
#backdrop{display:none}
#homeScene{display:none}

/* top bar */
#bar{background:var(--paper);border-bottom:var(--bw) solid var(--line);padding:8px 14px}
#homeBtn{border:var(--bw) solid var(--line);box-shadow:var(--hard)!important;border-radius:18px}
#homeBtn:active{transform:translateY(4px);box-shadow:var(--hardP)!important}
#barTitle{color:var(--ink)}
.pill{background:#fff;border:var(--bw) solid var(--line);box-shadow:var(--hard);border-radius:16px;color:var(--ink)}
.pill:active{transform:translateY(4px);box-shadow:var(--hardP)}

/* home */
#homeWrap{max-width:1180px;margin:0 auto}
.hero{display:flex;align-items:center;gap:16px;margin:14px 0 6px;flex-wrap:wrap}
.heroAv{width:78px;height:78px;border-radius:50%;background:var(--c);border:var(--bw) solid var(--line);box-shadow:var(--hard);font-size:46px;display:flex;align-items:center;justify-content:center;flex:none}
.heroAv:active{transform:translateY(4px);box-shadow:var(--hardP)}
.heroTxt{flex:1;min-width:180px}
.hero h1{color:var(--ink);text-shadow:none;font-size:clamp(34px,5.4vw,56px)}
.hero p{color:var(--ink2);text-shadow:none;font-size:clamp(16px,2vw,20px);margin-top:4px}
.allBtn{background:var(--ink);color:var(--paper);border:var(--bw) solid var(--line);box-shadow:0 5px 0 #FFC93C;border-radius:20px;height:60px}
.allBtn:active{transform:translateY(4px);box-shadow:0 1px 0 #FFC93C}
.allBtn small{background:rgba(255,247,234,.18)}
.homeSec{color:var(--ink);text-shadow:none;font-size:clamp(20px,2.6vw,26px);margin:22px 0 10px;letter-spacing:.2px}
.homeSec .emo{display:none}

.qrow{padding:2px 2px 14px}
.qtile{background:#fff!important;border:var(--bw) solid var(--line);box-shadow:var(--hard)!important;border-radius:var(--r);color:var(--ink);position:relative;overflow:hidden}
.qtile::after{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:var(--c);border-bottom:var(--bw) solid var(--line)}
.qtile:active{transform:translateY(4px)!important;box-shadow:var(--hardP)!important}
.qtile .emo{filter:none;margin-top:8px}
.qtile.new::before{display:none}

.worlds{gap:clamp(12px,1.8vw,20px)}
.worldCard{background:var(--c);color:#fff;border:var(--bw) solid var(--line);box-shadow:var(--hard);border-radius:var(--r);aspect-ratio:auto;min-height:170px;align-items:flex-start;justify-content:flex-start;text-align:left;padding:14px 16px 12px;gap:2px;transition:transform .08s}
.worldCard::after{display:none}
.worldCard:active{transform:translateY(4px);box-shadow:var(--hardP)}
.worldCard .wEmo{font-size:clamp(44px,6vw,64px);filter:none;margin-bottom:4px}
.worldCard b{font-size:clamp(20px,2.4vw,27px);text-shadow:0 2px 0 rgba(0,0,0,.18)}
.worldCard i{font-style:normal;font-size:14px;opacity:.9}
.worldCard .wTag{font-size:clamp(13px,1.4vw,15px);opacity:.95;line-height:1.2;font-weight:800}
.worldCard .wFoot{margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:space-between;width:100%}
.worldCard .wMini{font-size:20px;letter-spacing:2px;background:rgba(255,255,255,.9);border:2px solid var(--line);border-radius:999px;padding:3px 8px}
.worldCard .count{position:static;background:var(--paper);color:var(--ink);border:2px solid var(--line);font-family:var(--display);font-size:15px;padding:1px 10px}

/* world page */
.wBanner{display:flex;align-items:center;gap:16px;background:var(--c);color:#fff;border:var(--bw) solid var(--line);box-shadow:var(--hard);border-radius:var(--r);padding:12px 18px;margin:10px 0 18px}
.wBanner .emo{font-size:clamp(48px,7vw,72px);background:rgba(255,255,255,.92);border:var(--bw) solid var(--line);border-radius:50%;width:1.5em;height:1.5em;display:flex;align-items:center;justify-content:center;font-size:clamp(34px,4.6vw,48px);flex:none}
.wBanner h1{margin:0;font-family:var(--display);font-size:clamp(28px,4.4vw,44px);line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.wBanner p{margin:4px 0 0;font-size:clamp(14px,1.8vw,18px)}
.wBanner div{flex:1;min-width:0}
.wCount{background:var(--paper);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-family:var(--display);font-size:16px;flex:none}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;max-width:1180px}
.gcard{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:var(--bw) solid var(--line);box-shadow:var(--hard);border-radius:var(--r);padding:12px 14px;min-height:104px;color:var(--ink);position:relative}
.gcard:active{transform:translateY(4px);box-shadow:var(--hardP)}
.gIcon{width:76px;height:76px;flex:none;border-radius:20px;background:color-mix(in srgb,var(--c) 22%,#fff);border:var(--bw) solid var(--line);display:flex;align-items:center;justify-content:center;font-size:46px}
.gTxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.gTxt b{font-family:var(--display);font-size:clamp(19px,2vw,23px);line-height:1.05}
.gTxt i{font-style:normal;font-size:14px;color:var(--ink2)}
.gTxt small{font-size:15px;color:var(--ink2);line-height:1.25;font-weight:800}
.gMeta{position:absolute;top:8px;right:10px;display:flex;gap:6px;align-items:center;font-size:18px}
.gDone{background:#35C46A;color:#fff;border:2px solid var(--line);border-radius:999px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:14px;font-family:var(--body)}

/* "Little" look: fewer words, huge targets */
[data-look="little"] .gcards{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}
[data-look="little"] .gcard{flex-direction:column;justify-content:center;text-align:center;min-height:200px;padding:16px}
[data-look="little"] .gIcon{width:120px;height:120px;font-size:78px;border-radius:30px}
[data-look="little"] .gTxt{align-items:center}
[data-look="little"] .gTxt b{font-size:26px}
[data-look="little"] .gTxt small,[data-look="little"] .gTxt i,[data-look="little"] .gMeta{display:none}
[data-look="little"] .worldCard{min-height:210px;align-items:center;text-align:center;justify-content:center}
[data-look="little"] .worldCard .wEmo{font-size:clamp(70px,10vw,100px)}
[data-look="little"] .worldCard .wTag,[data-look="little"] .worldCard .wFoot,[data-look="little"] .worldCard i{display:none}
[data-look="little"] .worlds{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
[data-look="little"] .qtile{width:clamp(150px,20vw,190px)}
[data-look="little"] .wBanner p{display:none}

/* "Big kid" look: compact, more information */
[data-look="big"] .gcards{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
[data-look="big"] .gcard{min-height:76px;padding:8px 12px}
[data-look="big"] .gIcon{width:54px;height:54px;font-size:32px;border-radius:14px}
[data-look="big"] .gTxt b{font-size:19px}
[data-look="big"] .worlds{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
[data-look="big"] .worldCard{min-height:0;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;column-gap:14px;align-items:center}
[data-look="big"] .worldCard .wEmo{grid-row:1/4;font-size:48px;margin:0}
[data-look="big"] .worldCard .wFoot{grid-column:2;padding-top:4px}
[data-look="big"] .qtile{width:clamp(110px,12vw,140px)}

/* shared pieces inside games */
.qPrompt{background:#fff!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border:var(--bw) solid var(--line);box-shadow:var(--hard)!important;color:var(--ink)}
.qPrompt .emo{animation:none}
.choice,.card{border:var(--bw) solid var(--line)!important;box-shadow:var(--hard)!important}
.choice:active,.card:active{box-shadow:var(--hardP)!important}
.chip{border:2px solid var(--line)!important;box-shadow:0 3px 0 var(--line)!important}
.chip.on{background:var(--ink)!important;color:var(--paper)!important}
.overlay .panel{background:var(--paper);border:var(--bw) solid var(--line);box-shadow:0 8px 0 var(--line)}
.btn{border:var(--bw) solid var(--line)!important;box-shadow:var(--hard)!important}
.btn:active{transform:translateY(4px);box-shadow:var(--hardP)!important}
.agSearch{border:var(--bw) solid var(--line)!important;box-shadow:var(--hard)!important;background:#fff!important}
.dcardD{border:var(--bw) solid var(--line)!important;box-shadow:var(--hard)!important;background:#fff!important}
#caption .l{border:2px solid var(--line)}
@media (prefers-reduced-motion:reduce){.qtile,.gcard,.worldCard{transition:none}}
@media (max-width:600px){.gcards{grid-template-columns:1fr}.hero{gap:12px}.heroAv{width:62px;height:62px;font-size:36px}.allBtn{width:100%;justify-content:center}.worldCard{min-height:150px}[data-look="little"] .gcards{grid-template-columns:1fr 1fr}[data-look="little"] .gIcon{width:90px;height:90px;font-size:58px}[data-look="little"] .gcard{min-height:170px}}
.choice,.card{background:#fff!important}
.seg button,.avatars button{border:2px solid var(--line)!important;box-shadow:0 3px 0 var(--line)!important;background:#fff}
.seg button.on{background:var(--ink)!important;color:var(--paper)!important}
.avatars button.on{background:#FFC93C!important;outline:none}
.overlay input[type=text],.overlay select{border:var(--bw) solid var(--line)!important;border-radius:14px;background:#fff;box-shadow:none}
.overlay label{color:var(--ink2)}
@media (max-width:430px){#barTitle{font-size:19px}.pills{gap:6px}.pill{height:44px;padding:0 9px}#bar{gap:8px;padding:8px 10px}}
/* story library: book covers */
.stBook{border:var(--bw) solid var(--line);box-shadow:var(--hard)!important;border-radius:var(--r);background:#fff}
.stCover{background:var(--c)!important;border-bottom:var(--bw) solid var(--line);flex:1;justify-content:center}
.stCover .emo{filter:none!important}
.stBtns{margin-top:auto}
.stBtns .toy,.toy.floatBtnI,.stCh{border:var(--bw) solid var(--line);box-shadow:0 4px 0 var(--line)!important}
.stBtns .toy:active,.stCh:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)!important}
.stStage{border:var(--bw) solid var(--line);box-shadow:var(--hard)}
.stText{border:var(--bw) solid var(--line);box-shadow:var(--hard)}
.stHelp{border:2px solid var(--line)}
.stEnd{background:rgba(255,247,234,.9);-webkit-backdrop-filter:none;backdrop-filter:none}
/* any leftover chunky "toy" button inside games gets the same ink edge */
.screen .toy{border:var(--bw) solid var(--line)}
.screen .toy:not(.worldCard){box-shadow:0 5px 0 var(--line)}
.screen .toy:active{box-shadow:0 1px 0 var(--line)!important}
/* grown-ups dashboard */
.dcard{border:var(--bw) solid var(--line);box-shadow:var(--hard);border-radius:var(--r)}
.kpi{background:var(--paper);border:2px solid var(--line)}
.skillRow .bar{border:2px solid var(--line);height:16px;background:#fff}
.logList li{border-bottom:2px dashed rgba(43,35,64,.15)}

/* who is playing — ink on paper, no night-sky leftovers */
#whoScene{display:none}
.whoTitle{color:var(--ink);text-shadow:none;font-size:clamp(40px,7vw,64px);letter-spacing:-.5px}
.whoTitle small{display:block;color:#6B5E86;text-shadow:none;font-size:.38em;margin-top:6px;letter-spacing:0}
.kidCard{border:var(--bw) solid var(--line);box-shadow:var(--hard);border-radius:var(--r);background:#fff}
.kidCard:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.kidCard .av{border:var(--bw) solid var(--line)}
.kidCard.add{border-style:dashed;background:var(--paper)}
.kidCard.add .av{background:#fff}

/* white text on bright colour cards: give it an ink edge so it reads on orange, yellow and teal too */
.worldCard .wTag,.wBanner p,.wBanner .wCount{font-weight:800;text-shadow:0 1.5px 0 rgba(43,35,64,.45)}
.worldCard b,.worldCard h3,.wBanner h1{text-shadow:0 2px 0 rgba(43,35,64,.45)}
.actCard b,.dayBtn b,.dayBtn small,.floatBtn,.floatBtnI,.rBtns .go{text-shadow:0 2px 0 rgba(43,35,64,.4)}
.actCard b{font-size:clamp(20px,2.4vw,24px)}
.actCard small{font-size:17px;opacity:1;letter-spacing:2px}
.dayBtn small{font-size:16px;font-weight:800;opacity:1}
.bcStage{border:var(--bw) solid var(--line);box-shadow:var(--hard)}

/* ---- audit fixes: kid switch, quiz highlight, contrast, in-game surfaces, small text, glassy leftovers ---- */
/* little look: no one-tap "switch child" inside activities (still there on home/world for parents) */
body[data-look="little"]:not([data-screen="home"]):not([data-screen="world"]) #kidBtn{display:none}
/* show the right answer again (the theme's !important white/shadow hid .good) */
.choice.good{background:#DFFFE8!important;border-color:var(--green)!important;box-shadow:0 0 0 6px var(--green),var(--hard)!important}
/* second-language lines: darker pink that passes contrast on white */
.qPrompt i,.placard .l2,#showB,.storyText .l2,.stText .l2,.dsMean,#feedName span{color:#C2185B}
/* small white text on bright world colours: put it on a white chip (extends the ink-edge block above) */
.worldCard .wTag,.worldCard i,.wBanner p{color:var(--ink);background:rgba(255,255,255,.92);border:2px solid var(--line);border-radius:10px;padding:2px 8px;text-shadow:none;opacity:1;display:inline-block;width:auto;max-width:100%;justify-self:start;box-sizing:border-box}
/* in-game surfaces still on the old glossy look */
.acard,.mem .f,.mem .b,.tray,.tbtn,.tool,.scbtn,.traceStrip button,.rCode,.rBtns button,.food,.bcItem,.bcBaby,.dsCard,.digName{box-sizing:border-box;border:var(--bw) solid var(--line);box-shadow:var(--hard)}
.acard{background:#fff}
.acard:active,.tbtn:active,.tool:active,.scbtn:active,.traceStrip button:active,.rBtns button:active,.food:active,.bcItem:active,.bcBaby:active{box-shadow:var(--hardP)}
.tbtn.on{box-shadow:0 0 0 3px #FFC93C,var(--hard)}
.bcBaby.on{box-shadow:0 0 0 4px var(--pink),var(--hard)}
.mem .b{background:var(--purple)}
/* body text no smaller than ~13-15px */
.tbtn small{font-size:12px}
.wk b{font-size:clamp(14px,1.6vw,18px)}
.qtile small{font-size:clamp(13px,1.4vw,15px);line-height:1.1}
.dcardD small,.kpi span,.logList li span.t,.weekBars div{font-size:15px}
.dsCredit{font-size:13px}
/* glassy dark leftovers: caption bubble and top-bar pills go paper */
#caption{background:var(--paper);color:var(--ink);border:var(--bw) solid var(--line);box-shadow:var(--hard);-webkit-backdrop-filter:none;backdrop-filter:none}
#caption .l{border:0}
#caption .b{color:#C2185B}
#bar .pill{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}
#barTitle{text-shadow:none}
</style>
</head>

<div id="backdrop" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div>
<div id="app">

    <section class="screen fixed" id="s-puzzle" hidden></section>
    <section class="screen fixed" id="s-sorter" hidden></section>
    <section class="screen fixed" id="s-bath" hidden></section>
    <section class="screen fixed" id="s-dots" hidden></section>
    <section class="screen fixed" id="s-peek" hidden></section>
    <section class="screen fixed" id="s-feed" hidden></section>
    <section class="screen fixed" id="s-playworld" hidden></section>
    <section class="screen fixed" id="s-quiz" hidden></section>
    <section class="screen" id="s-cards" hidden></section>
    <section class="screen fixed" id="s-trace" hidden></section>
    <section class="screen fixed" id="s-robot" hidden></section>
    <section class="screen fixed" id="s-memory" hidden></section>
    <section class="screen fixed" id="s-story" hidden></section>
    <section class="screen fixed" id="s-breathe" hidden></section>
    <section class="screen fixed" id="s-paint" hidden></section>

    <section class="screen fixed" id="s-bubbles" hidden></section>

<div class="overlay" id="spot" hidden>

function impulse(ctx, secs) {

      lp += k * ((Math.random() * 2 - 1) - lp);

      d[i] = (lp + early) * Math.pow(1 - x, 2.2) * Math.exp(-x * 2.5);

// mallet family: sine partials with independent decays [ratio, amp, decayFactor]
const MAL = {
  marimba: [[1, 1, 1], [3.93, .22, .22]],
  kalimba: [[1, 1, 1], [5.43, .16, .18]],
  bell:    [[1, 1, 1], [2.76, .32, .5], [5.4, .14, .3]],
  glock:   [[1, 1, 1], [5.9, .12, .2]],
  wood:    [[1, 1, 1], [2.47, .35, .4]]

    const n = N(ctx, t0, t1), lp = F(ctx, 'lowpass', 12, .5), g = G(ctx, p.jit * 25);   // ~p.jit*0.45 cents RMS

  return T;
}

<script>/* Wonder World — Dino World: museum with real science, fossil dig, egg hatching, dino dinner, big-or-small, dino quiz, time machine, sticker book */
(() => {
'use strict';
const W = window.WW, { $, $$, esc, rnd, shuffle, clamp } = W;
const D = W.DINOS, byId = id => D.find(d => d.id === id);
const T = (en, sp) => W.tr(en, sp), P = a => T(a[0], a[1]); // text in the home language (W.TR keyed by the final English)
const sayT = (en, sp) => W.say2(en, sp);
// speak several sentences: each part is [en, es] (translated on its own, so the dictionary key is that sentence) or a plain string (same in every language, e.g. a name)
const sayP = (...parts) => { const h = W.home(), Q = parts.filter(Boolean), tx = (id, p) => typeof p === 'string' ? p : W.trL(id, p[0], p[1]); const ok = Q.map(p => typeof p === 'string' || (tx(h, p), W.trHas(h, p[0]))).every(Boolean);
  return W.say([L => { const id = W.langId(L); return Q.map(p => tx(id, p)).join(' '); }], ok ? {} : { langs: ['en'] }); };
const svg = (d, o) => W.dinoSVG(d, o);
// real paleoart (free-licensed, credited) when we have it; the cartoon otherwise
const ART = () => W.DINO_ART || {};
const artSrc = id => (window.__WW_ART && window.__WW_ART[id]) || 'dinoart/' + id + '.webp';
const real = (d, cls = '') => ART()[d.id] ? `<img class="dinoReal ${cls}" src="${artSrc(d.id)}" alt="${esc(d.name)}" loading="lazy" decoding="async" onerror="this.replaceWith(document.createRange().createContextualFragment(this.dataset.fb))" data-fb="${esc(svg(d))}">` : svg(d);
const credit = d => { const a = ART()[d.id]; return a ? `${esc(T('Art', 'Arte'))}: ${esc(a.artist || 'Wikimedia Commons')} · ${esc(a.license)}` : ''; };
function openCredits() { const L = Object.entries(ART()).map(([id, a]) => { const d = byId(id); return `<li><b>${esc(d ? d.name : id)}</b> — ${esc(a.artist || '?')} · ${esc(a.license)} · <a href="${esc(a.page)}" target="_blank" rel="noopener">${esc(T('source', 'fuente'))}</a></li>`; }).join('');
  const b = W.modal(`<h3>🖼️ ${esc(T('Picture credits', 'Créditos de imágenes'))}</h3><p class="muted">${esc(T('Dinosaur illustrations are free-licensed artworks from Wikimedia Commons, shown with thanks to their artists. Cartoons are original to Wonder World.', 'Las ilustraciones son obras con licencia libre de Wikimedia Commons, con agradecimiento a sus artistas. Los dibujos animados son originales de Wonder World.'))}</p><ul class="credits">${L}</ul><div class="btnrow"><button class="btn" id="crClose">${esc(T('Close', 'Cerrar'))}</button></div>`); b.querySelector('#crClose').onclick = W.closeModal; }
W.dinoCredits = openCredits;
const dietWord = d => { const v = W.DINO_DIET[d.diet]; return T(v[1], v[2]); };
const ageWord = d => P(W.DINO_AGES[d.age]);
const place = d => W.DINO_PLACES[d.place];
const fmtN = n => n >= 10 ? Math.round(n) : n >= 1 ? Math.round(n * 10) / 10 : n;
const wtT = d => T(weightText(d, false), weightText(d, true)); // weight in the home language
function weightText(d, sp = false) { const T = (en, s) => sp ? s : en; const kg = d.wt * 1000; if (kg < 1) return T(`${Math.round(kg * 1000)} grams`, `${Math.round(kg * 1000)} gramos`); if (kg < 1000) return T(`${fmtN(kg)} kilograms`, `${fmtN(kg)} kilos`); return T(`${fmtN(d.wt)} tons`, `${fmtN(d.wt)} toneladas`); }
function compareLen(d, sp = false) { const T = (en, s) => sp ? s : en; const L = d.len; if (d.wing) return T(`Its wings were ${fmtN(L)} meters wide.`, `Sus alas medían ${fmtN(L)} metros de ancho.`);
  if (L >= 12) { const b = Math.round(L / 12 * 2) / 2; return T(`It was ${fmtN(L)} meters long. That's ${b === 1 ? 'one school bus' : b + ' school buses'}!`, `Medía ${fmtN(L)} metros de largo. ¡Eso es ${b === 1 ? 'un autobús escolar' : b + ' autobuses escolares'}!`); }
  if (L >= 2) { const k = Math.round(L); return T(`It was ${fmtN(L)} meters long, about as long as ${k} kids lying in a row.`, `Medía ${fmtN(L)} metros, como ${k} niños acostados en fila.`); }
  return T(`It was only ${fmtN(L)} meters long. Small!`, `Medía solo ${fmtN(L)} metros. ¡Pequeñito!`); }
function compareWt(d, sp = false) { const T = (en, s) => sp ? s : en; if (d.wt >= 6) { const e = Math.round(d.wt / 6); return T(`It weighed as much as ${e === 1 ? 'one elephant' : e + ' elephants'}.`, `Pesaba como ${e === 1 ? 'un elefante' : e + ' elefantes'}.`); }
  if (d.wt >= .5) return T(`It weighed about ${weightText(d, sp)}, as heavy as a car or more.`, `Pesaba unos ${weightText(d, sp)}, tanto como un carro o más.`);
  if (d.wt >= .02) return T(`It weighed about ${weightText(d, sp)}.`, `Pesaba unos ${weightText(d, sp)}.`);
  return T(`It weighed only ${weightText(d, sp)}, lighter than a cat.`, `Pesaba solo ${weightText(d, sp)}, menos que un gato.`); }
const icons = (e, n, max = 8) => { const whole = Math.floor(Math.min(n, max)), part = Math.min(n, max) - whole; let s = ''; for (let i = 0; i < whole; i++) s += `<span class="emo">${e}</span>`; if (part > .15) s += `<span class="emo" style="clip-path:inset(0 ${Math.round((1 - part) * 100)}% 0 0)">${e}</span>`; return s + (n > max ? `<b>×${Math.round(n)}</b>` : ''); };
function sizeRow(d) { const L = d.len; if (L >= 12) return icons('🚌', L / 12, 4); if (L >= 1) return icons('🧒', L, 10); return icons('🐈', L / .5, 4); }

/* roar: synthesized, deeper for bigger animals, chirpy for small ones */
W.dinoRoar = d => { const a = W.actx(); if (!a) return; const t = a.currentTime, big = clamp(Math.log10(d.wt * 1000 + 1) / 5, 0, 1);
  if (d.group === 'sea') { W.tone(120 + (1 - big) * 200, .9, 'sine', .25, 0, 80); W.sfx.splash(); return; }
  if (d.group === 'fly' || d.plan === 'bird') { [0, .12, .24].forEach(dl => W.tone(1400 - big * 700, .12, 'triangle', .16, dl, 900 - big * 400)); return; }
  if (big < .45) { [0, .1].forEach(dl => W.tone(900, .14, 'sawtooth', .08, dl, 500)); return; }
  const o = a.createOscillator(), o2 = a.createOscillator(), g = a.createGain(), lp = a.createBiquadFilter(), n = a.createBufferSource(), nb = a.createBuffer(1, a.sampleRate * 1.3, a.sampleRate), nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = (Math.random() * 2 - 1) * (1 - i / nd.length); n.buffer = nb; const ng = a.createGain(); ng.gain.value = .35;
  const f0 = 170 - big * 110; o.type = 'sawtooth'; o2.type = 'square'; o.frequency.setValueAtTime(f0 * 1.4, t); o.frequency.exponentialRampToValueAtTime(f0, t + .35); o.frequency.exponentialRampToValueAtTime(f0 * .7, t + 1.2); o2.frequency.value = f0 * .51;
  lp.type = 'lowpass'; lp.frequency.setValueAtTime(900, t); lp.frequency.exponentialRampToValueAtTime(300, t + 1.2); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.32, t + .12); g.gain.exponentialRampToValueAtTime(.0001, t + 1.3);
  o.connect(lp); o2.connect(lp); n.connect(ng); ng.connect(lp); lp.connect(g); g.connect(a.destination); o.start(t); o2.start(t); n.start(t); o.stop(t + 1.35); o2.stop(t + 1.35); n.stop(t + 1.35); };

/* ---------- sticker collection ---------- */
function found(d, quiet) { const isNew = W.collect('dino', d.id); if (isNew && !quiet) { const b = document.createElement('div'); b.className = 'stickerToast'; b.innerHTML = `${svg(d)}<b>${esc(T('New sticker!', '¡Nueva calcomanía!'))}</b>`; document.body.append(b); setTimeout(() => b.remove(), 2600); W.sfx.star(); } return isNew; }
const nCollected = () => Object.keys(W.collected('dino')).length;

/* ---------- spotlight (the museum card) ---------- */
let SP = { list: [], i: 0 };
function spotlight(list, i) { SP = { list, i }; renderSpot(); }
function renderSpot() {
  const d = SP.list[SP.i], pl = place(d), era = W.DINO_ERAS.find(e => e[0] === d.era), eraIdx = W.DINO_ERAS.indexOf(era), g = W.DINO_GROUPS[d.group];
  let ov = $('#dinoSpot'); if (!ov) { ov = document.createElement('div'); ov.id = 'dinoSpot'; ov.className = 'overlay'; document.body.append(ov); }
  ov.hidden = false; document.body.classList.add('ov'); const isNew = found(d, true);
  ov.innerHTML = `<div class="dsBg" style="--era:${era[3]}"></div><button class="xbtn emo" data-x="1" aria-label="${esc(T('Close', 'Cerrar'))}">✖️</button>
    <div class="dsWrap"><div class="dsArt ${ART()[d.id] ? 'hasReal' : ''}" id="dsArt">${real(d, 'big')}${ART()[d.id] ? `<small class="dsCredit">${credit(d)}</small>` : ''}</div>
    <div class="dsCard"><h3>${esc(d.name)}</h3><div class="dsMean">“${esc(P(d.mean))}”</div>
      <div class="dsTags"><span style="--c:${era[3]}">⏳ ${esc(ageWord(d))} · ${esc(d.mya)} ${esc(T('million years ago', 'millones de años'))}</span><span>${W.DINO_DIET[d.diet][0]} ${esc(dietWord(d))}</span><span>${pl[0]} ${esc(T(pl[1], pl[2]))}</span>${d.group !== 'dino' ? `<span class="warn">${g[0]} ${esc(T('Not a dinosaur!', '¡No es dinosaurio!'))}</span>` : ''}</div>

      <p class="dsFact">${esc(P(d.fact))}</p></div></div>
    <div class="navrow dsNav"><button class="toy round emo" style="--c:#fff;color:var(--ink)" data-n="-1">⬅️</button><button class="toy round emo" style="--c:var(--red)" data-roar="1">🦖</button><button class="toy round emo" style="--c:var(--green)" data-more="1">💬</button><button class="toy round emo" style="--c:#fff;color:var(--ink)" data-n="1">➡️</button></div>`;

    if (b.dataset.x) { ov.hidden = true; document.body.classList.remove('ov'); W.stopVoice(); if (W.cur === 'dino' && W.params.act === 'dinomuseum') renderMuseum(); return; }

const W = window.WW, { $ } = W;
const FILES = ['config.js', 'data.js', ...W.LANGS.map(l => `i18n/${l.id}.js`), 'i18n-extra.js', 'i18n-tr.js', 'core.js', 'sound.js', 'scenes.js', 'app.js', 'games/animals.js', 'games/learn.js', 'games/quiz.js', 'games/skills.js', 'games/art.js', 'games/music.js', 'games/adventure.js', 'games/play.js', ...(W.EXTRA_FILES || []), 'start.js'];
// Pack the whole app plus this child's voices into one file that works offline
W.downloadGame = async () => {
  try {
    if (window.__WW_VOICE) return;
    let css = ''; for (const f of ['styles.css', 'games/play.css', 'games/extra.css', 'games/theme.css']) { try { css += await (await fetch(f)).text(); } catch (e) {} }
    const scripts = []; for (const f of FILES) scripts.push(`<script>${(await (await fetch(f)).text()).replace(/<\/script>/gi, '<\\/script>')}<\/script>`);
    for (const u of (W.EXTERNAL_LIBS || []).slice().reverse()) { try { scripts.unshift(`<script>${(await (await fetch(u)).text()).split('</' + 'script').join('<\\/script')}<\/script>`); } catch (e) {} } // three.js etc. so the island works offline
    const voice = {}; const b64 = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(',')[1]); fr.readAsDataURL(b); });
    for (const id of [...W.langs(), ...W.langs().map(l => 'x_' + l), 'hello']) { try { const idx = await (await fetch(`voice/${id}.json`)).json(), packs = []; for (let n = 0; n < idx.n; n++) packs.push(await b64(await (await fetch(`voice/${id}/${n}.mp3`)).blob())); voice[id] = { idx, packs }; } catch (e) {} }
    const body = document.querySelector('#app').outerHTML.replace(/<section class="screen[^>]*>[\s\S]*?<\/section>/g, m => m.replace(/(<section[^>]*>)[\s\S]*(<\/section>)/, '$1$2'));
    const overlays = [...document.querySelectorAll('body > .overlay, #caption, #fx')].map(n => n.outerHTML).join('\n');
    const html = `<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Wonder World</title><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>${css}</style><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body>${body}\n${overlays}<script>window.__WW_VOICE=${JSON.stringify(voice)};<\/script>${scripts.join('\n')}</body></html>`;
    await W.offerFile('Wonder-World.html', new Blob([html], { type: 'text/html' }));
  } catch (e) { console.error(e); }
};
if (window.__WW_VOICE) W.downloadGame = null;

function boot() {
  if (!W.S.profiles.length && W.CFG.DEFAULT_KID) { const k = W.newProfile(W.CFG.DEFAULT_KID); W.S.profiles.push(k); W.S.cur = k.id; W.saveState(); }
  $('#gearT').textContent = W.ui('parents');
  if (!W.S.profiles.length) { W.go('who'); setTimeout(() => W.editKid(null), 400); return; }
  if (!W.kid()) W.S.cur = W.S.profiles[0].id;
  W.saveState(); W.setDir(); W.loadKidClips(); [...W.langs(), 'hello'].forEach(W.loadVoice); W.updateStars();
  $('#kidAv').textContent = W.kid().avatar; W.go('home');
}
boot();
})();
</script>
<script>/* Wonder World app mode (only in the installable/offline build):
   - registers the service worker (sw.js) so the game opens with no internet,
   - adds an "Offline & install" card to Grown-ups → Settings: download every voice for offline play, keep storage,
     and install the app on the home screen (Android/Chrome/Edge prompt, iPhone/iPad instructions). */
(() => {
const W = window.WW; if (!W || !('serviceWorker' in navigator) || location.protocol === 'file:') return;
const esc = W.esc, T = (en, es) => W.tr(en, es);
navigator.serviceWorker.register('sw.js').catch(() => {});
let deferred = null, lastMsg = '';
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; });
addEventListener('appinstalled', () => { deferred = null; });
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const LANGS = (W.LANGS || [{ id: 'en' }]).map(l => l.id);
const voiceIds = langs => langs.flatMap(l => [l, 'x_' + l]).concat('hello');
async function files(ids) { // every pack of every voice id (index lists how many)
  const out = [];
  for (const id of ids) { try { const ix = await (await fetch('voice/' + id + '.json')).json(); out.push('voice/' + id + '.json'); for (let n = 0; n < ix.n; n++) out.push('voice/' + id + '/' + n + '.mp3'); } catch (e) {} }
  return out;
}
async function download(langs, bar, msg) {
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
  const list = (await files(voiceIds(langs))).filter(u => u.endsWith('.mp3')), cache = await caches.open('ww-media'); let done = 0, fail = 0;
  const step = async u => { try { if (!(await cache.match(new URL(u, location.href).href))) { const r = await fetch(u); if (!r.ok) throw 0; await r.arrayBuffer(); /* the service worker saves it */ } } catch (e) { fail++; } done++; bar.style.width = Math.round(done / list.length * 100) + '%'; };
  const q = list.slice(); await Promise.all([0, 1, 2, 3].map(async () => { while (q.length) await step(q.shift()); }));
  lastMsg = msg.textContent = fail ? T('Some files did not download. Connect to the internet and tap again.', 'Algunos archivos no se descargaron. Conéctate a internet y toca otra vez.') + ` (${fail})`
    : T('Ready! Every voice works without internet.', '¡Listo! Todas las voces funcionan sin internet.');
  render();
}
async function status() {
  let used = '', cached = 0;
  try { const e = await navigator.storage.estimate(); used = Math.round((e.usage || 0) / 1e6) + ' MB'; } catch (e) {}
  try { cached = (await (await caches.open('ww-media')).keys()).length; } catch (e) {}
  return { used, cached };
}
function card() {
  const kidLangs = [...new Set((W.S.profiles || []).flatMap(p => p.langs || []).filter(Boolean))];
  const mine = kidLangs.length ? kidLangs : [W.home()];
  const name = l => { const i = W.langInfo(l); return (i && (i.native || i.name)) || l; };
  const install = standalone() ? `<p class="muted">✅ ${esc(T('Wonder World is installed on this device.', 'Wonder World está instalado en este dispositivo.'))}</p>`
    : deferred ? `<button class="toy floatBtnI" style="--c:var(--green)" id="wwInstall"><span class="emo">📲</span>${esc(T('Install the app', 'Instalar la app'))}</button>`
    : isIOS() ? `<p class="muted">📲 ${esc(T('To install on iPhone or iPad: tap the Share button in Safari, then "Add to Home Screen".', 'Para instalar en iPhone o iPad: toca Compartir en Safari y luego "Agregar a inicio".'))}</p>`
    : `<p class="muted">📲 ${esc(T('To install: open the browser menu and choose "Install app" or "Add to Home screen".', 'Para instalar: abre el menú del navegador y elige "Instalar app" o "Agregar a la pantalla de inicio".'))}</p>`;
  return `<div class="dcard" id="wwOffline"><h4>✈️ ${esc(T('Play without internet', 'Jugar sin internet'))}</h4>
    <p class="muted">${esc(T('The games already work offline. Download the voices so the narrator can talk with no internet too.', 'Los juegos ya funcionan sin conexión. Descarga las voces para que el narrador también hable sin internet.'))}</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin:10px 0">
      <button class="toy floatBtnI" style="--c:var(--purple)" data-dl="${esc(mine.join(','))}"><span class="emo">⬇️</span>${esc(T('Download voices', 'Descargar voces'))} (${esc(mine.map(name).join(', '))})</button>
      <button class="toy floatBtnI" style="--c:#8A7BB8" data-dl="${esc(LANGS.join(','))}"><span class="emo">🌍</span>${esc(T('All languages', 'Todos los idiomas'))}</button></div>
    <div style="height:14px;border-radius:9px;background:rgba(0,0,0,.08);overflow:hidden"><div id="wwBar" style="height:100%;width:0;background:var(--green);transition:width .2s"></div></div>
    <p class="muted" id="wwMsg"></p>${install}</div>`;
}
async function render() {
  const sec = document.querySelector('#s-parent'); if (!sec || W.cur !== 'parent') return;
  const old = sec.querySelector('#wwOffline'); const host = old || sec.appendChild(document.createElement('div'));
  const tmp = document.createElement('div'); tmp.innerHTML = card(); const el = tmp.firstElementChild; host.replaceWith(el);
  const s = await status(); const m = el.querySelector('#wwMsg'); if (m && lastMsg) { m.textContent = lastMsg; lastMsg = ''; } else if (m && s.cached) m.textContent = T('Voice files saved on this device:', 'Archivos de voz guardados en este dispositivo:') + ` ${s.cached} (${s.used})`;
  el.onclick = async e => {
    e.stopPropagation();
    const d = e.target.closest('[data-dl]'); if (d) { el.querySelectorAll('[data-dl]').forEach(b => b.disabled = true); el.querySelector('#wwMsg').textContent = T('Downloading… keep this screen open.', 'Descargando… deja esta pantalla abierta.'); return download(d.dataset.dl.split(','), el.querySelector('#wwBar'), el.querySelector('#wwMsg')); }
    if (e.target.closest('#wwInstall') && deferred) { deferred.prompt(); try { await deferred.userChoice; } catch (x) {} deferred = null; render(); }
  };
}
const P = W.screens.parent, enter = P.enter.bind(P);
P.enter = p => { enter(p); if ((p && p.tab) === 'settings') render(); };
})();
</script>
