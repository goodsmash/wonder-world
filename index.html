<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wonder World</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CFEFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wonder World">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">

<link rel="stylesheet" href="vendor/fonts.css">
<style>:root{
  --ink:#22304D;--ink2:#56648A;--paper:#FFFFFF;--sky:#CFEFFF;--sky2:#F3FBFF;
  --red:#FF5E57;--orange:#FF9F43;--yellow:#FFC93C;--green:#35C46A;--blue:#2E95F0;--purple:#8B63F0;--pink:#FF6FB1;--teal:#1FBFCB;
  --display:'Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans','Noto Sans Devanagari','Noto Sans Arabic','PingFang SC','Microsoft YaHei',sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Android Emoji',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:linear-gradient(180deg,var(--sky),var(--sky2) 70%);color:var(--ink);font-family:var(--body);font-weight:800;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
input,select{font:inherit;-webkit-user-select:text;user-select:text}
.emo{font-family:var(--emoji);line-height:1;font-weight:400}
#app{height:100%;display:flex;flex-direction:column}

/* top bar */
#bar{display:flex;align-items:center;gap:10px;padding:10px 16px 8px;flex:none;position:relative;z-index:5}
#homeBtn{width:56px;height:56px;border-radius:20px;font-size:30px;display:flex;align-items:center;justify-content:center;flex:none}
#barTitle{font-family:var(--display);font-size:clamp(20px,3vw,30px);line-height:1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#barTitle small{display:block;font-family:var(--body);font-size:.5em;color:var(--ink2);margin-top:3px}
.pills{display:flex;gap:8px;flex:none;align-items:center}
.pill{height:48px;padding:0 14px;border-radius:16px;background:#fff;display:flex;align-items:center;gap:6px;font-size:15px;box-shadow:0 4px 0 rgba(34,48,77,.14)}
.pill .emo{font-size:22px}
.pill:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(34,48,77,.14)}
#starBox{font-family:var(--display);font-size:22px}
#kidBtn .emo{font-size:28px}
@media (max-width:700px){.pill .t{display:none}.pill{padding:0 11px}}

.toy{--c:var(--blue);background:var(--c);color:#fff;border-radius:28px;box-shadow:0 7px 0 rgba(0,0,0,.22),0 14px 22px rgba(34,48,77,.15);transition:transform .09s ease,box-shadow .09s ease}
@supports (color:color-mix(in srgb,red,blue)){.toy{box-shadow:0 7px 0 color-mix(in srgb,var(--c) 66%,#1a1238),0 14px 22px rgba(34,48,77,.15)}.toy:active{box-shadow:0 1px 0 color-mix(in srgb,var(--c) 66%,#1a1238),0 4px 10px rgba(34,48,77,.12)!important}}
.toy:active{transform:translateY(6px);box-shadow:0 1px 0 rgba(0,0,0,.22),0 4px 10px rgba(34,48,77,.12)}

#stage{position:relative;flex:1;min-height:0}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:4px 16px 40px;-webkit-overflow-scrolling:touch}
.screen.fixed{overflow:hidden;padding-bottom:14px;display:flex;flex-direction:column;gap:10px}
.screen.full{padding:0;overflow:hidden}
h2.sec{font-family:var(--display);font-size:clamp(22px,3vw,30px);margin:18px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2.sec small{font-family:var(--body);font-size:.62em;color:var(--ink2)}
.bgscene{position:absolute;inset:0;width:100%;height:100%;display:block}

/* who is playing */
#s-who{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px;overflow:auto}
#s-who .bgscene{position:fixed;z-index:0}
.whoTitle{position:relative;z-index:1;font-family:var(--display);font-size:clamp(34px,6vw,64px);margin:0;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.18),0 10px 30px rgba(0,0,0,.2);text-align:center;line-height:1}
.whoTitle small{display:block;font-size:.42em;margin-top:8px;opacity:.95}
.kids{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.kidCard{width:150px;padding:16px 10px;border-radius:30px;background:rgba(255,255,255,.92);display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 8px 0 rgba(0,0,0,.12),0 20px 40px rgba(0,0,0,.18)}
.kidCard .av{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:58px;background:var(--c)}
.kidCard b{font-family:var(--display);font-size:24px}
.kidCard.add .av{background:#E8F0F8;font-size:44px}
.whoParents{position:relative;z-index:1}

/* home map */
#s-home{padding:0}
#homeScene{position:absolute;inset:0}
.homeWrap{position:relative;z-index:1;height:100%;overflow-y:auto;padding:8px 16px 40px;-webkit-overflow-scrolling:touch}
.hero{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px;margin:4px 0 16px}
.hero h1{font-family:var(--display);font-size:clamp(34px,6vw,60px);margin:0;line-height:.95;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.15),0 10px 24px rgba(0,0,0,.18);text-wrap:balance}
.hero p{margin:6px 0 0;color:#fff;font-size:clamp(15px,2vw,19px);text-shadow:0 2px 6px rgba(0,0,0,.25)}
.worlds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,2vw,22px)}
@media (max-width:900px){.worlds{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){.worlds{grid-template-columns:repeat(2,minmax(0,1fr))}}
.worldCard{position:relative;aspect-ratio:1/.9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;text-align:center;overflow:hidden}
.worldCard .emo{font-size:clamp(50px,8vw,88px);filter:drop-shadow(0 6px 0 rgba(0,0,0,.14))}
.worldCard b{font-family:var(--display);font-size:clamp(18px,2.4vw,28px);line-height:1.05}
.worldCard small{font-size:clamp(12px,1.5vw,16px);opacity:.92}
.worldCard::after{content:"";position:absolute;inset:-40% -40% auto auto;width:80%;height:80%;border-radius:50%;background:rgba(255,255,255,.18)}
.worldCard .count{position:absolute;top:10px;left:12px;background:rgba(255,255,255,.3);border-radius:999px;padding:2px 10px;font-size:13px}

/* world: activity list */
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.actCard{position:relative;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 10px;text-align:center}
.actCard .emo{font-size:62px}
.actCard b{font-family:var(--display);font-size:21px;line-height:1.05;text-wrap:balance}
.actCard small{font-size:14px;opacity:.9}
.actCard .lock{position:absolute;top:10px;right:12px;font-size:22px}
.actCard .ageTag{position:absolute;top:10px;left:12px;font-size:12px;background:rgba(255,255,255,.28);border-radius:999px;padding:2px 8px}
.actCard.dim{opacity:.55}

/* chips */
.chips{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 12px;scrollbar-width:none;flex:none;align-items:center}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:48px;padding:0 16px;border-radius:999px;background:#fff;display:flex;align-items:center;gap:8px;font-size:16px;box-shadow:0 4px 0 rgba(34,48,77,.12);white-space:nowrap}
.chip .emo{font-size:24px}
.chip.on{background:var(--c,var(--ink));color:#fff}
.chip.ico{width:52px;padding:0;justify-content:center}.chip.ico .emo{font-size:28px}
.divider{flex:none;width:2px;height:34px;background:rgba(34,48,77,.15);margin:0 4px}

/* cards grid (learn) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.card{background:#fff;border-radius:24px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 6px 0 rgba(34,48,77,.12),0 12px 18px rgba(34,48,77,.08);border:4px solid var(--c,transparent);text-align:center}
.card:active{transform:translateY(4px)}
.card .emo{font-size:clamp(52px,7vw,66px)}
.card b{font-family:var(--display);font-size:20px;line-height:1.05}
.card span.s{color:var(--ink2);font-size:15px}
.blob{width:86px;height:86px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12)}
.bignum{font-family:var(--display);font-size:72px;line-height:.9;color:var(--blue)}
.card svg{width:84px;height:84px}
.letter{font-family:var(--display);font-size:60px;line-height:1;color:var(--purple)}

.lovecard{min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 10px;text-align:center}
.lovecard .emo{font-size:48px}.lovecard b{font-family:var(--display);font-size:19px;line-height:1.1;text-wrap:balance}.lovecard .s{font-size:14px;opacity:.92}
/* overlays */
.overlay{position:fixed;inset:0;z-index:40}
.dim{background:rgba(34,48,77,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.panel{background:#fff;border-radius:28px;padding:22px;width:min(600px,100%);max-height:100%;overflow:auto;box-shadow:0 30px 60px rgba(34,48,77,.3);box-sizing:border-box}
.panel h3{font-family:var(--display);font-size:30px;margin:0 0 6px}
.panel label{display:block;margin:14px 0 6px;color:var(--ink2);font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.panel input[type=text]{width:100%;box-sizing:border-box;height:52px;border-radius:16px;border:3px solid #D6E6F5;padding:0 14px;font-size:20px;color:var(--ink)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{min-height:46px;padding:0 14px;border-radius:14px;background:var(--sky2);font-size:16px;box-shadow:0 3px 0 rgba(34,48,77,.12)}
.seg button.on{background:var(--ink);color:#fff}
.avatars{display:flex;flex-wrap:wrap;gap:8px}
.avatars button{width:54px;height:54px;border-radius:50%;font-size:32px;background:var(--sky2)}
.avatars button.on{box-shadow:0 0 0 4px var(--ink);background:#FFF1B8}
.muted{color:var(--ink2);font-weight:700;font-size:15px;line-height:1.45}
.btnrow{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.btn{height:52px;padding:0 22px;border-radius:16px;background:var(--ink);color:#fff;font-size:17px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.btn.alt{background:var(--sky2);color:var(--ink)}
.btn.danger{background:var(--red)}
.round{width:72px;height:72px;border-radius:50%;font-size:34px;display:flex;align-items:center;justify-content:center}
#gateQ{font-family:var(--display);font-size:44px;text-align:center;margin:10px 0}
#gateOpts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
#gateOpts button{height:70px;border-radius:18px;background:var(--sky2);font-family:var(--display);font-size:30px;box-shadow:0 4px 0 rgba(34,48,77,.12)}

/* spotlight */
#spot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);overflow:hidden;touch-action:none;background:#8ED8FF}
#spot .bgscene{position:absolute;inset:0}
.xbtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;width:62px;height:62px;border-radius:50%;background:#fff;font-size:30px;box-shadow:0 5px 0 rgba(34,48,77,.18);z-index:3}
#spotWrap{position:relative;z-index:2;animation:bob 2.4s ease-in-out infinite}
#spotEmoji{font-size:min(34vh,52vw);line-height:1.08;filter:drop-shadow(0 18px 12px rgba(0,0,0,.25));cursor:pointer;display:block;touch-action:none}
.placard{position:relative;z-index:2;background:rgba(255,255,255,.94);border-radius:26px;padding:12px 22px 14px;max-width:560px;width:100%;text-align:center;box-shadow:0 8px 0 rgba(34,48,77,.12),0 18px 30px rgba(34,48,77,.14)}
.placard h3{font-family:var(--display);font-size:clamp(34px,5.4vw,56px);margin:0;line-height:1}
.placard .l2{color:var(--pink);font-family:var(--display);font-size:clamp(24px,3.6vw,36px);line-height:1.1}
.says{display:inline-flex;gap:8px;align-items:center;margin:8px 0 0;padding:6px 14px;border-radius:999px;background:var(--sky2);font-size:clamp(16px,2.2vw,21px)}
.navrow{position:relative;z-index:2;display:flex;gap:18px;align-items:center}

/* big show card */
#show .show-card{position:relative;background:#fff;border-radius:34px;padding:26px 22px 22px;width:min(640px,100%);text-align:center;box-shadow:0 10px 0 rgba(34,48,77,.15),0 30px 60px rgba(34,48,77,.3);animation:popin .35s cubic-bezier(.3,1.6,.5,1)}
#showBig{font-size:clamp(90px,20vh,170px);line-height:1.05;cursor:pointer}
#showBig .row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:clamp(34px,6vh,56px);margin-top:8px}
#showBig .row span{animation:popin .4s cubic-bezier(.3,1.6,.5,1) both}
#showBig .num{font-family:var(--display);font-size:clamp(90px,18vh,160px);color:var(--blue);line-height:.9}
#showA{font-family:var(--display);font-size:clamp(28px,4.6vw,46px);line-height:1.1;margin-top:8px;text-wrap:balance}
#showB{font-family:var(--display);font-size:clamp(20px,3.4vw,32px);color:var(--pink);line-height:1.15;margin-top:4px;text-wrap:balance}
.show-actions{display:flex;gap:16px;justify-content:center;margin-top:16px}

/* quiz */
.qPrompt{width:100%;background:#fff;border-radius:26px;padding:14px 18px;display:flex;align-items:center;justify-content:center;gap:14px;box-shadow:0 6px 0 rgba(34,48,77,.12);flex:none;text-align:center}
.qPrompt .emo{font-size:40px}
.qPrompt b{font-family:var(--display);font-size:clamp(24px,4vw,40px);line-height:1.05;display:block}
.qPrompt i{font-style:normal;color:var(--pink);font-family:var(--display);font-size:clamp(18px,2.8vw,28px);display:block}
.qShow{flex:none;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;font-size:clamp(40px,8vw,72px);min-height:1em}
.choices{flex:1;min-height:0;display:grid;gap:16px;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));align-content:center}
@media (max-width:620px){.choices{grid-template-columns:repeat(2,minmax(0,1fr))}}
.choice{background:#fff;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:1/1;max-height:36vh;font-size:clamp(60px,11vw,120px);box-shadow:0 8px 0 rgba(34,48,77,.13),0 14px 24px rgba(34,48,77,.1);justify-self:center;width:100%;padding:8px}
.choice.wide{aspect-ratio:auto;min-height:120px;font-size:clamp(40px,7vw,70px)}
.choice small{font-family:var(--display);font-size:clamp(16px,2.4vw,24px);color:var(--ink);line-height:1.05}
.choice svg{width:62%;height:62%}
.choice .blob{width:66%;height:66%}
.choice.good{background:#DFFFE8;box-shadow:0 0 0 6px var(--green),0 8px 0 rgba(34,48,77,.13)}
.choice.num{font-family:var(--display);color:var(--blue)}
.shake{animation:shake .45s}
.qFoot{display:flex;justify-content:space-between;align-items:center;flex:none;gap:10px}
.qFoot .prog{display:flex;gap:6px}
.qFoot .prog i{width:14px;height:14px;border-radius:50%;background:rgba(34,48,77,.15);display:block}
.qFoot .prog i.on{background:var(--yellow);box-shadow:0 0 0 2px #fff}
.side{display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:6px;font-size:clamp(34px,6vw,54px)}

/* trace */
#traceWrap,#paintWrap,#pondWrap,#reefWrap,#scene,#bubArea{position:relative;flex:1;min-height:0;border-radius:28px;overflow:hidden;touch-action:none;box-shadow:0 10px 24px rgba(34,48,77,.15)}
#traceWrap{background:#fff}
#traceWrap canvas,#paintWrap canvas,#pondWrap canvas,#reefWrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.traceStrip{display:flex;gap:8px;overflow-x:auto;flex:none;scrollbar-width:none;padding:2px}
.traceStrip::-webkit-scrollbar{display:none}
.traceStrip button{flex:none;min-width:56px;height:56px;border-radius:16px;background:#fff;font-family:var(--display);font-size:30px;box-shadow:0 4px 0 rgba(34,48,77,.12);padding:0 8px}
.traceStrip button.on{background:var(--purple);color:#fff}
.meter{height:14px;border-radius:999px;background:rgba(34,48,77,.12);overflow:hidden;flex:none}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--yellow));border-radius:999px;transition:width .2s}

/* robot */
.robotWrap{flex:1;min-height:0;display:flex;gap:16px;align-items:stretch}
@media (max-width:760px){.robotWrap{flex-direction:column}}
#rGrid{flex:1;min-height:0;display:grid;gap:6px;background:linear-gradient(#BDF0C9,#8ED8A0);border-radius:24px;padding:10px;aspect-ratio:1/1;max-height:100%;align-self:center;max-width:100%;box-shadow:0 10px 24px rgba(34,48,77,.15)}
#rGrid div{background:rgba(255,255,255,.55);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,5vmin,48px);position:relative}
#rGrid div.path{background:rgba(255,236,150,.9)}
.rSide{display:flex;flex-direction:column;gap:12px;min-width:220px;flex:none}
.rCode{min-height:80px;background:#fff;border-radius:20px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;box-shadow:0 5px 0 rgba(34,48,77,.1)}
.rCode span{width:44px;height:44px;border-radius:12px;background:var(--sky2);display:flex;align-items:center;justify-content:center;font-size:24px}
.rCode span.run{background:var(--yellow)}
.rBtns{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center}
.rBtns button{height:64px;border-radius:18px;background:#fff;font-size:30px;box-shadow:0 5px 0 rgba(34,48,77,.14)}
.rBtns .go{grid-column:span 3;background:var(--green);color:#fff;font-family:var(--display);font-size:24px}

/* memory */
.memGrid{flex:1;min-height:0;display:grid;gap:12px;grid-template-columns:repeat(var(--c,4),minmax(0,1fr));align-content:center}
.mem{aspect-ratio:1/1;border-radius:22px;position:relative;transform-style:preserve-3d;transition:transform .35s;max-height:26vh;width:100%;justify-self:center}
.mem .f,.mem .b{position:absolute;inset:0;border-radius:22px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mem .b{background:linear-gradient(135deg,var(--purple),var(--blue));font-size:clamp(28px,5vw,44px);box-shadow:0 6px 0 rgba(0,0,0,.2)}
.mem .f{background:#fff;transform:rotateY(180deg);font-size:clamp(40px,8vw,72px);box-shadow:0 6px 0 rgba(34,48,77,.13)}
.mem.open{transform:rotateY(180deg)}
.mem.done .f{background:#DFFFE8}

/* story */
.storyStage{position:relative;flex:1;min-height:0;border-radius:28px;overflow:hidden;box-shadow:0 10px 24px rgba(34,48,77,.15)}
.storyStage .bgscene{position:absolute;inset:0}
.storyArt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(30vh,40vw);z-index:2;filter:drop-shadow(0 16px 12px rgba(0,0,0,.2))}
.storyText{flex:none;background:#fff;border-radius:24px;padding:14px 18px;box-shadow:0 6px 0 rgba(34,48,77,.1);font-size:clamp(20px,3vw,30px);line-height:1.35;font-family:var(--display);text-align:center}
.storyText .w{border-radius:8px;padding:0 2px;transition:background .15s}
.storyText .w.on{background:#FFE680}
.storyText .l2{display:block;color:var(--pink);font-size:.72em;margin-top:6px}
.storyNav{display:flex;justify-content:center;gap:16px;flex:none}

/* breathe */
#breathe{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;border-radius:28px;overflow:hidden}
#breathe .bgscene{position:absolute;inset:0}
.bCircle{position:relative;z-index:2;width:min(46vh,60vw);height:min(46vh,60vw);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#BDE6FF 45%,#8B63F0);box-shadow:0 0 80px rgba(139,99,240,.5);display:flex;align-items:center;justify-content:center;font-size:min(16vh,20vw);transform:scale(.6)}
.bText{position:absolute;bottom:20px;left:0;right:0;z-index:2;text-align:center;font-family:var(--display);font-size:clamp(22px,3.4vw,34px);color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.35)}

/* world (play) */
#sceneDeco{position:absolute;inset:0;pointer-events:none;z-index:1}
#sceneDeco span{position:absolute;transform:translate(-50%,-50%)}
#actors{position:absolute;inset:0;z-index:2}
.actor{position:absolute;transform:translate(-50%,-50%);cursor:grab;touch-action:none;filter:drop-shadow(0 8px 5px rgba(0,0,0,.2));transition:left 1.5s ease-in-out,top 1.5s ease-in-out}
.actor b,.actor i{display:block;font-style:normal;font-weight:400}
.actor i{transition:transform .18s}
.actor.flip i{transform:scaleX(-1)}
.actor.held{transition:none;filter:drop-shadow(0 18px 10px rgba(0,0,0,.28))}
.actor.held b{transform:scale(1.12)}
.wrow{display:flex;gap:8px;overflow-x:auto;flex:none;align-items:center;scrollbar-width:none;padding:2px}
.wrow::-webkit-scrollbar{display:none}
.scbtn{flex:none;height:52px;padding:0 14px;border-radius:16px;background:#fff;display:flex;align-items:center;gap:6px;font-size:15px;box-shadow:0 4px 0 rgba(34,48,77,.13)}
.scbtn .emo{font-size:26px}
.scbtn.on{background:var(--ink);color:#fff}
.swatch{flex:none;width:44px;height:44px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 0 rgba(34,48,77,.18)}
.swatch.on{box-shadow:0 0 0 3px var(--ink)}
.tray{display:flex;gap:6px;overflow-x:auto;padding:8px;background:#fff;border-radius:22px;flex:none;box-shadow:0 5px 0 rgba(34,48,77,.1)}
.tray button{flex:none;font-size:44px;width:66px;height:66px;border-radius:18px;background:var(--sky2);display:flex;align-items:center;justify-content:center}

/* animals museum */
.acard{background:#fff;border-radius:24px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;border:4px solid var(--c);box-shadow:0 6px 0 var(--c),0 12px 18px rgba(34,48,77,.1)}
.acard .emo{font-size:clamp(56px,8vw,72px);margin-bottom:4px}
.acard b{font-family:var(--display);font-size:20px;line-height:1.05}
.acard span{font-size:15px;color:var(--ink2)}

/* peek / feed */
#peekStage{position:relative;flex:1;min-height:0;border-radius:28px;padding:16px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#peekStage .bgscene{position:absolute;inset:0}
#peekGrid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,2vw,22px);width:100%;height:100%}
@media (max-width:620px){#peekGrid{grid-template-columns:repeat(2,1fr)}}
.pk{position:relative;border-radius:30px;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:min(15vh,17vw);animation:popin .45s cubic-bezier(.3,1.6,.5,1) both;box-shadow:inset 0 0 0 4px rgba(255,255,255,.5)}
.pk .hide,.pk .who{display:block}
.pk.cracked::after{content:"⚡";position:absolute;font-size:.35em;top:30%;left:46%;font-family:var(--emoji)}
.floatBtn{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);height:64px;padding:0 26px;border-radius:22px;font-family:var(--display);font-size:24px;display:flex;align-items:center;gap:10px;z-index:3;animation:popin .4s cubic-bezier(.3,1.6,.5,1)}
#feedStage{position:relative;flex:1;min-height:0;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
#feedStage .bgscene{position:absolute;inset:0}
#feedAnimal{position:relative;z-index:2;font-size:min(34vh,42vw);line-height:1.05;filter:drop-shadow(0 16px 10px rgba(0,0,0,.2))}
#feedName{position:relative;z-index:2;font-family:var(--display);font-size:clamp(26px,4vw,40px);line-height:1;background:rgba(255,255,255,.85);border-radius:16px;padding:6px 14px}
#feedName span{color:var(--pink)}
#foodTray{display:flex;justify-content:center;gap:clamp(10px,2.5vw,24px);flex:none}
.food{width:clamp(76px,13vw,112px);height:clamp(76px,13vw,112px);border-radius:26px;background:#fff;font-size:clamp(46px,8vw,70px);box-shadow:0 6px 0 rgba(34,48,77,.14);touch-action:none}
.flyfood{position:fixed;z-index:90;font-size:clamp(60px,10vw,90px);transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 10px 8px rgba(0,0,0,.25))}
.hint{text-align:center;color:var(--ink2);margin:0;font-size:15px;flex:none}

/* bubbles */
#bubArea{background:radial-gradient(circle at 30% 20%,#E4F7FF,#9FD8FF 60%,#6FB9F5)}
.bubble{position:absolute;left:0;top:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 8%,rgba(255,255,255,.25) 18%,rgba(255,255,255,.08) 55%,rgba(170,120,255,.25) 80%,rgba(255,255,255,.7) 100%);box-shadow:inset 0 0 18px rgba(255,255,255,.7),0 6px 16px rgba(34,48,77,.1);will-change:transform}
.bubble .emo{pointer-events:none}
.bubble.pop{transition:transform .18s,opacity .18s;opacity:0}

/* art studio */
#paintWrap{background:#fff}
#lineC{pointer-events:none}
.studio{flex:1;min-height:0;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:1fr auto;gap:10px;grid-template-areas:"tools canvas colors" "tools actions colors"}
#toolCol{grid-area:tools;display:grid;grid-template-columns:repeat(2,64px);gap:8px;overflow-y:auto;align-content:start;padding:2px 4px 8px;scrollbar-width:none}
.studio #paintWrap{grid-area:canvas}
#colorCol{grid-area:colors;display:grid;grid-template-columns:repeat(2,48px);gap:10px;overflow-y:auto;align-content:start;padding:6px 6px 8px;scrollbar-width:none}
#toolCol::-webkit-scrollbar,#colorCol::-webkit-scrollbar,#actRow::-webkit-scrollbar{display:none}
#actRow{grid-area:actions;display:flex;gap:8px;overflow-x:auto;align-items:center;padding:2px 2px 6px;scrollbar-width:none}
.dot{flex:none;width:48px;height:48px;border-radius:50%;border:5px solid #fff;box-shadow:0 4px 0 rgba(34,48,77,.18);transition:transform .12s}
.dot.on{transform:scale(1.16);box-shadow:0 0 0 4px var(--ink)}
.tbtn{width:64px;height:64px;border-radius:18px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:0 4px 0 rgba(34,48,77,.14)}
.tbtn .emo{font-size:30px}
.tbtn small{font-size:10px;line-height:1;color:var(--ink2);max-width:60px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tbtn.on{background:var(--yellow);transform:scale(1.07);box-shadow:0 0 0 3px var(--ink)}
.tool{flex:none;min-width:56px;height:56px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;box-shadow:0 4px 0 rgba(34,48,77,.14);font-size:15px}
.tool .emo{font-size:28px}
.tool.on{background:var(--yellow)}
.tool.warn{background:var(--red);color:#fff}
.sz{display:block;border-radius:50%;background:var(--ink)}
@media (max-width:760px){.studio{grid-template-columns:1fr;grid-template-rows:1fr auto auto auto;grid-template-areas:"canvas" "colors" "tools" "actions"}
  #toolCol{display:flex;overflow-x:auto;overflow-y:hidden;padding:2px}.tbtn{flex:none}
  #colorCol{display:flex;overflow-x:auto;overflow-y:hidden;padding:4px}#colorCol .dot{flex:none;width:44px;height:44px}}
#magicDone{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:2;height:64px;padding:0 24px;border-radius:22px;font-family:var(--display);font-size:24px;display:flex;align-items:center;gap:10px}
.holding{position:relative;overflow:hidden}
.holding::after{content:"";position:absolute;left:0;bottom:0;height:5px;width:100%;background:var(--green);transform-origin:left;animation:holdfill var(--hold,1200ms) linear forwards}

/* music */
#dancers{display:flex;justify-content:center;gap:18px;font-size:44px;flex:none}
.dancer{transition:transform .12s}.dancer.up{transform:translateY(-12px) rotate(-8deg) scale(1.08)}
#kb{position:relative;flex:1;min-height:0;max-height:62vh;touch-action:none;border-radius:22px;background:#22304D;padding:10px 10px 14px;box-shadow:0 10px 24px rgba(34,48,77,.25)}
#kb .whites{display:flex;height:100%;gap:4px}
.wk{flex:1;background:linear-gradient(#fff,#F2F6FB);border-radius:0 0 14px 14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;padding-bottom:12px;box-shadow:inset 0 -8px 0 #D9E3EE}
.wk i{width:18px;height:18px;border-radius:50%;display:block}
.wk b{font-family:var(--display);font-size:clamp(11px,1.5vw,17px);color:var(--ink2)}
.wk .emo{font-size:clamp(18px,3vw,34px)}
.bk{position:absolute;top:10px;height:58%;background:linear-gradient(#3A4158,#12151F);border-radius:0 0 10px 10px;box-shadow:inset 0 -6px 0 #000,0 4px 6px rgba(0,0,0,.4);z-index:2}
.wk.down{background:linear-gradient(#FFF6C4,#FFE070);box-shadow:inset 0 -2px 0 #E0C040;transform:translateY(3px)}
.bk.down{background:linear-gradient(#8B63F0,#5A3AC0)}
.wk.next{background:linear-gradient(#DFFFE8,#8FF0AE);animation:glow 1s ease-in-out infinite}
.bk.next{background:linear-gradient(#35C46A,#1E8A48);animation:glow 1s ease-in-out infinite}
#pads{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:14px;touch-action:none}
.pad{background:var(--c);border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.22),inset 0 -10px 0 rgba(0,0,0,.1)}
.pad .emo{font-size:clamp(34px,6vw,60px)}
.pad.hit{transform:scale(.94);filter:brightness(1.35)}

/* parent dashboard */
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.dcard{background:#fff;border-radius:24px;padding:18px;box-shadow:0 6px 0 rgba(34,48,77,.08)}
.dcard h4{margin:0 0 10px;font-family:var(--display);font-size:22px}
.kpis{display:flex;gap:12px;flex-wrap:wrap}
.kpi{flex:1;min-width:90px;background:var(--sky2);border-radius:16px;padding:10px 12px}
.kpi b{display:block;font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--ink2)}
.skillRow{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.skillRow .bar{height:14px;border-radius:999px;background:rgba(34,48,77,.08);overflow:hidden}
.skillRow .bar i{display:block;height:100%;border-radius:999px}
.skillRow em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.logList{list-style:none;margin:0;padding:0;font-size:15px}
.logList li{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #EEF3F8}
.logList li span.t{margin-left:auto;color:var(--ink2);font-size:13px;font-variant-numeric:tabular-nums}
.weekBars{display:flex;align-items:flex-end;gap:8px;height:90px}
.weekBars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:12px;color:var(--ink2)}
.weekBars i{width:100%;background:var(--blue);border-radius:8px 8px 3px 3px;min-height:3px}

/* pond / reef */
#pondWrap{background:#0E4E6B}
#reefWrap{background:#0A3A66}
.floatHint{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:3;background:rgba(255,255,255,.85);border-radius:999px;padding:8px 16px;font-size:15px;color:var(--ink);pointer-events:none;white-space:nowrap}

/* caption + fx */
#caption{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translateX(-50%);z-index:60;background:rgba(34,48,77,.92);color:#fff;border-radius:22px;padding:10px 20px;width:max-content;max-width:min(92vw,720px);font-size:clamp(16px,2.2vw,22px);text-align:center;pointer-events:none;transition:opacity .3s}
#caption.off,body.ov #caption,body[data-screen=quiz] #caption,body[data-screen=story] #caption{opacity:0}
#caption .l{display:block;opacity:.55;line-height:1.35}
#caption .l.now{opacity:1}
#caption .b{color:#FFD86B}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
#fx span{position:absolute;margin:-.5em 0 0 -.5em}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
@keyframes popin{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes drift{0%{margin-left:-3%}100%{margin-left:3%}}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
@keyframes holdfill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
[dir=rtl] .pills{flex-direction:row-reverse}
/* Wild Adventure */
#advStage{position:relative;flex:1;min-height:0;border-radius:28px;overflow:hidden;touch-action:none;box-shadow:0 10px 24px rgba(34,48,77,.15);background:#9FE7C3}
#advStage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#advStage .floatHint{transition:opacity .8s}
#advTray button{touch-action:none}
body[data-screen=safari] #caption,body[data-screen=playworld] #caption,body[data-screen=reef] #caption,body[data-screen=pond] #caption{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 118px)}

/* ================= 2026 visual polish layer ================= */
:root{--wc:#2E95F0;--glass:rgba(255,255,255,.9);--lip:rgba(34,48,77,.16);--r:30px}
body{background:#BFE8FF}
#backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 110%,color-mix(in srgb,var(--wc) 30%,#fff) 0%,transparent 60%),linear-gradient(180deg,color-mix(in srgb,var(--wc) 34%,#8FD3FF) 0%,color-mix(in srgb,var(--wc) 10%,#EAF7FF) 62%,#F7FCFF 100%);transition:background .6s}
#backdrop i{position:absolute;border-radius:50%;background:#fff;opacity:.55;filter:blur(2px);animation:drift 60s linear infinite}
#backdrop i::before,#backdrop i::after{content:"";position:absolute;background:#fff;border-radius:50%}
#backdrop i{width:180px;height:56px;top:9%;left:-220px}
#backdrop i::before{width:90px;height:90px;left:30px;top:-44px}#backdrop i::after{width:70px;height:70px;left:95px;top:-30px}
#backdrop i:nth-child(2){top:26%;animation-duration:85s;animation-delay:-30s;transform:scale(.7);opacity:.45}
#backdrop i:nth-child(3){top:4%;animation-duration:110s;animation-delay:-70s;opacity:.4}
#backdrop i:nth-child(4){top:40%;animation-duration:140s;animation-delay:-20s;opacity:.3}
#backdrop b{position:absolute;left:-10%;right:-10%;bottom:-40px;height:26vh;border-radius:50% 50% 0 0/100% 100% 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--wc) 22%,#9BE07F),color-mix(in srgb,var(--wc) 14%,#6CC75A));opacity:.35}
@keyframes drift{to{transform:translateX(calc(100vw + 460px))}}
@media (prefers-reduced-motion:reduce){#backdrop i{animation:none}}
#app{position:relative;z-index:1}
#bar .pill{background:rgba(255,255,255,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#barTitle{color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.6)}
/* cards: chunky, glossy, touchable */
.card,.acard,.choice,.qPrompt,.mem .f,.lovecard{border-radius:var(--r)}
.card{background:linear-gradient(180deg,#fff 0%,#fff 60%,color-mix(in srgb,var(--c,#fff) 10%,#fff) 100%);border:0;box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--c,#9AB) 45%,transparent),0 8px 0 var(--lip),0 16px 28px rgba(34,48,77,.12);padding:16px 8px 16px;transition:transform .12s cubic-bezier(.3,1.6,.5,1)}
.card:active,.acard:active,.choice:active{transform:scale(.94) translateY(4px)}
.card .emo{font-size:clamp(46px,7vw,72px);filter:drop-shadow(0 6px 4px rgba(0,0,0,.14))}
.card b{font-family:var(--display);font-size:clamp(16px,2vw,22px);line-height:1.05}
.grid{grid-template-columns:repeat(auto-fill,minmax(clamp(120px,15vw,168px),1fr));gap:clamp(10px,1.6vw,20px)}
.acard{border:0;background:linear-gradient(180deg,#fff 65%,color-mix(in srgb,var(--c) 14%,#fff));box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--c) 55%,transparent),0 8px 0 var(--lip),0 14px 24px rgba(34,48,77,.12);padding:14px 6px 16px}
.acard .emo{filter:drop-shadow(0 6px 4px rgba(0,0,0,.15))}
.chip{box-shadow:0 5px 0 var(--lip)}
/* quiz: fill the screen, huge friendly answers */
.qPrompt{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 0 var(--lip);padding:12px 18px;cursor:pointer}
.qPrompt .emo{font-size:40px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) scale(1.06)}}
.choices{gap:clamp(12px,2vw,24px);align-content:stretch;padding:4px 2px 8px}
.choice{max-height:none;height:100%;aspect-ratio:auto;min-height:120px;background:linear-gradient(180deg,#fff 60%,#F1F7FF);box-shadow:inset 0 -8px 0 rgba(46,149,240,.18),0 10px 0 var(--lip),0 18px 30px rgba(34,48,77,.12);font-size:clamp(64px,min(13vw,17vh),150px)}
.choice.good{animation:good .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes good{40%{transform:scale(1.08) rotate(-2deg)}}
.qShow{filter:drop-shadow(0 6px 6px rgba(0,0,0,.12))}
/* captions: small, at the bottom, never covering the game */
#caption{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);font-size:clamp(15px,1.9vw,19px);padding:8px 18px;background:rgba(34,48,77,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);max-width:min(88vw,620px)}
#caption .l{display:inline;opacity:1}#caption .l+.l::before{content:" · ";opacity:.6}
/* world + activity cards */
.actCard{border-radius:var(--r);min-height:clamp(140px,20vh,190px)}
.actCard .emo{font-size:clamp(48px,7vw,70px);filter:drop-shadow(0 8px 6px rgba(0,0,0,.18))}
.worldCard .emo{filter:drop-shadow(0 8px 8px rgba(0,0,0,.2))}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);filter:drop-shadow(0 0 22px rgba(255,255,255,.9))}}
.storyText{font-size:clamp(20px,2.6vw,30px)}
.grid.fit,.acts.fit{display:grid;align-content:start}
.grid.fit .card,.acts.fit .actCard{height:100%;min-height:0;justify-content:center}
.grid.fit .card .emo,.grid.fit .card svg,.grid.fit .card .blob{font-size:calc(var(--tile) * .42)!important}
.grid.fit .card .bignum{font-size:calc(var(--tile) * .42)}
.grid.fit .card b{font-size:clamp(16px,calc(var(--tile) * .12),30px)}
.acts.fit .actCard .emo{font-size:calc(var(--tile) * .4)}
.acts.fit .actCard b{font-size:clamp(18px,calc(var(--tile) * .1),30px)}
.grid.fit .card svg,.grid.fit .card .blob{width:calc(var(--tile) * .5);height:calc(var(--tile) * .5)}
.grid.fit .card .blob .emo{font-size:calc(var(--tile) * .26)!important}
.floatHint{white-space:normal;max-width:min(90%,560px);text-align:center;line-height:1.3}

/* Wonder World — hands-on play screens: puzzle, sorter, bath, dots */
#s-puzzle,#s-sorter,#s-bath,#s-dots{gap:12px;padding-top:2px}
.plStage{position:relative;flex:1;min-height:0;border-radius:28px;overflow:hidden;touch-action:none;background:#FFF3DA;box-shadow:0 10px 26px rgba(34,48,77,.16),0 0 0 4px rgba(255,255,255,.75);-webkit-user-select:none;user-select:none}
#soStage{background:#DDF7EA}#baStage{background:#D8F4FF}#doStage{background:#1E2A78}
.plStage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.plStage canvas:active{cursor:grabbing}
.plNext{position:absolute;right:clamp(12px,2.5vw,24px);bottom:clamp(12px,2.5vw,24px);width:clamp(76px,11vmin,100px);height:clamp(76px,11vmin,100px);border-radius:50%;font-size:clamp(38px,5.5vmin,50px);display:flex;align-items:center;justify-content:center;z-index:4;animation:plIn .6s cubic-bezier(.3,1.6,.5,1) both,plBeat 1.8s 1s ease-in-out infinite}
.plNext::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid rgba(53,196,106,.5);animation:plRing 1.8s 1s ease-out infinite;pointer-events:none}

/* bath tools */
.bathTools{flex:none;display:flex;justify-content:center;align-items:center;gap:clamp(18px,5vw,44px);padding:6px 0 4px}
.btool{--c:var(--blue);--p:0;position:relative;width:clamp(78px,11vmin,100px);height:clamp(78px,11vmin,100px);border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(40px,6vmin,54px);box-shadow:0 6px 0 rgba(34,48,77,.13),0 12px 20px rgba(34,48,77,.1);transition:transform .18s cubic-bezier(.3,1.6,.5,1),background .2s;touch-action:manipulation}
.btool::before{content:"";position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p) * 360deg),rgba(34,48,77,.1) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px))}
.btool.on{transform:translateY(-8px) scale(1.1);background:radial-gradient(circle at 35% 30%,#fff,color-mix(in srgb,var(--c) 28%,#fff))}
.btool.hint{animation:plWig 1.3s ease-in-out infinite}
.btool.done::after{content:"✓";position:absolute;right:-4px;top:-4px;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;font:900 19px/30px var(--body);text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.15);animation:plIn .4s cubic-bezier(.3,1.6,.5,1)}
.btool .emo{pointer-events:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.15))}
.towelIco{position:relative;display:block;width:.92em;height:.72em;border-radius:.12em;background:repeating-linear-gradient(90deg,#FF8FC2 0 .15em,#FFC3DE .15em .27em);box-shadow:inset 0 -.1em 0 rgba(160,40,90,.18),0 .06em .08em rgba(0,0,0,.15);pointer-events:none}
.towelIco::before{content:"";position:absolute;left:-.1em;right:-.1em;top:-.12em;height:.16em;border-radius:.08em;background:linear-gradient(#E0B887,#B98A55)}
.towelIco::after{content:"";position:absolute;left:0;right:0;bottom:.12em;height:.07em;background:rgba(255,255,255,.9)}

@keyframes plIn{from{transform:scale(0) rotate(-120deg)}to{transform:scale(1) rotate(0)}}
@keyframes plBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes plRing{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.35);opacity:0}}
@keyframes plWig{0%,100%{transform:rotate(0)}15%{transform:rotate(-12deg) scale(1.06)}30%{transform:rotate(10deg) scale(1.06)}45%{transform:rotate(-6deg)}60%{transform:rotate(0)}}
@media (max-width:520px){#s-puzzle,#s-sorter,#s-bath,#s-dots{padding-left:10px;padding-right:10px}.plStage{border-radius:22px}}
@media (max-height:520px){.btool{width:64px;height:64px;font-size:34px}.bathTools{padding:2px 0 0}}
/* keep the caption out of the way: numbers are already on the dots */
body[data-screen=dots] #caption,body[data-screen=puzzle] #caption{opacity:0}
body[data-screen=sorter] #caption{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 26px)}
body[data-screen=bath] #caption{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 132px)}

/* ===== Wonder World: Dino World ===== */
.dinoSvg{width:100%;height:auto;display:block;overflow:visible}
.dinoCount{font-family:var(--display);font-size:18px;color:var(--ink2);margin:0 0 8px}
.dinoCount.big{font-size:clamp(24px,3.4vw,34px);color:var(--ink);margin-top:10px}
.dinoGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(130px,15vw,176px),1fr));gap:clamp(10px,1.4vw,16px);padding-bottom:30px}
.dcardD{background:linear-gradient(180deg,#fff 62%,color-mix(in srgb,var(--c,#E07A2E) 14%,#fff));border-radius:26px;padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:inset 0 -5px 0 color-mix(in srgb,var(--c,#E07A2E) 40%,transparent),0 7px 0 rgba(34,48,77,.12),0 12px 20px rgba(34,48,77,.1);position:relative;content-visibility:auto;contain-intrinsic-size:170px 170px}
.dcardD:active{transform:scale(.95)}
.dcardD b{font-family:var(--display);font-size:clamp(14px,1.7vw,18px);line-height:1.05;text-align:center}
.dcardD small{font-size:13px;color:var(--ink2)}
.dcardD.got::after{content:"⭐";position:absolute;top:6px;right:8px;font-family:var(--emoji);font-size:20px}
.dcardD.shadow .dinoSvg{filter:brightness(0) opacity(.18)}
#dinoSpot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 12px);overflow:auto}
.dsBg{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 100%,color-mix(in srgb,var(--era) 45%,#fff),color-mix(in srgb,var(--era) 18%,#EAF7FF) 60%,#fff);z-index:-1}
.dsWrap{display:flex;gap:18px;align-items:center;justify-content:center;width:min(1080px,100%);flex-wrap:wrap}
.dsArt{flex:1 1 360px;max-width:560px;cursor:pointer;animation:dsBob 3s ease-in-out infinite;filter:drop-shadow(0 18px 14px rgba(0,0,0,.18))}
@keyframes dsBob{50%{transform:translateY(-3%) rotate(-1deg)}}
.dsCard{flex:1 1 340px;max-width:520px;background:rgba(255,255,255,.95);border-radius:28px;padding:16px 20px;box-shadow:0 8px 0 rgba(34,48,77,.1),0 18px 30px rgba(34,48,77,.14)}
.dsCard h3{font-family:var(--display);font-size:clamp(30px,4.6vw,48px);margin:0;line-height:1}
.dsMean{color:var(--pink);font-family:var(--display);font-size:clamp(18px,2.4vw,24px);margin:2px 0 8px}
.dsTags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.dsTags span{background:color-mix(in srgb,var(--c,#2E95F0) 16%,#fff);border-radius:999px;padding:4px 10px;font-size:14px}
.dsTags .warn{background:#FFE3E0;color:#B0322A}
.dsRow{margin:6px 0}.dsRow b{font-size:15px}
.dsIcons{display:flex;flex-wrap:wrap;gap:2px;align-items:center;font-size:26px;min-height:30px}.dsIcons b{font-size:16px;margin-left:6px}
.dsTime{display:flex;gap:4px;margin:10px 0 4px}.dsTime i{flex:1;height:12px;border-radius:6px;transition:transform .3s}
.dsFact{font-size:clamp(16px,2vw,19px);line-height:1.4;margin:8px 0 0}
.dsNav{margin-top:4px}
.stickerToast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:95;background:#fff;border-radius:26px;padding:10px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 40px rgba(34,48,77,.3);animation:toast 2.6s ease both;pointer-events:none}

@keyframes toast{0%{opacity:0;transform:translate(-50%,-30px) scale(.6)}12%{opacity:1;transform:translate(-50%,0) scale(1.05)}20%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-20px)}}
/* dig */
.digStage{position:relative;flex:1;min-height:0;border-radius:28px;overflow:hidden;background:radial-gradient(circle at 50% 60%,#8C6A42,#5E4128);box-shadow:0 10px 24px rgba(34,48,77,.2);touch-action:none}
.digFossil,.digColor{position:absolute;left:10%;right:10%;top:8%;bottom:8%;display:flex;align-items:center;justify-content:center}
.digFossil .dinoSvg,.digColor .dinoSvg{max-height:100%;width:auto;height:100%}
.digColor{opacity:0;cursor:pointer}
.digBits span{position:absolute;font-size:clamp(28px,4vw,44px);transform:translate(-50%,-50%)}
.digStage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.digBar{display:flex;gap:12px;align-items:center;flex:none}.digBar .round{width:64px;height:64px;font-size:30px}
.digName{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#fff;border-radius:20px;padding:6px 18px;font-family:var(--display);font-size:clamp(24px,3.6vw,38px);box-shadow:0 6px 0 rgba(0,0,0,.12)}
/* hatch */
.hatchStage{position:relative;flex:1;min-height:0;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 10px 24px rgba(34,48,77,.15)}
.nest{position:relative;z-index:2;display:flex;justify-content:center;align-items:flex-end;gap:clamp(10px,4vw,48px);padding:0 16px 7%}
.nestTwigs{position:absolute;left:8%;right:8%;bottom:3%;height:26%;border-radius:50%;background:repeating-linear-gradient(20deg,#8A5A2A 0 6px,#A87038 6px 12px,#6A4020 12px 16px);z-index:-1;box-shadow:inset 0 10px 20px rgba(0,0,0,.3)}
.egg{position:relative;width:clamp(90px,20vw,190px);aspect-ratio:100/124}
.eggSvg{width:100%;height:100%;filter:drop-shadow(0 10px 8px rgba(0,0,0,.25))}
.egg .baby{position:absolute;left:-30%;right:-30%;bottom:0}
.babyRow{position:relative;z-index:2;display:flex;gap:6px;justify-content:center;padding:6px;background:rgba(255,255,255,.5);min-height:60px}
.babyRow span{width:74px}
/* dinner */
.dinnerStage{position:relative;flex:1;min-height:0;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(34,48,77,.15)}
.dnDino{position:relative;z-index:2;width:min(70%,560px);cursor:pointer;filter:drop-shadow(0 16px 10px rgba(0,0,0,.2))}
.dnName{position:relative;z-index:2;font-family:var(--display);font-size:clamp(24px,3.6vw,38px);background:rgba(255,255,255,.88);border-radius:16px;padding:4px 16px}
.dnBubble{position:absolute;z-index:3;top:14px;right:16px;background:#fff;border-radius:20px;padding:8px 14px;font-size:28px;font-family:var(--emoji);box-shadow:0 4px 0 rgba(34,48,77,.12)}
.foodTray{display:flex;justify-content:center;gap:clamp(8px,2vw,20px);flex:none;flex-wrap:wrap}
/* big or small */
.bsStage{position:relative;flex:1;min-height:0;border-radius:28px;overflow:hidden;box-shadow:0 10px 24px rgba(34,48,77,.15)}
.bsRow{position:absolute;left:3%;right:3%;bottom:6%;top:4%;overflow:hidden;display:flex;align-items:flex-end;justify-content:space-around;gap:10px;z-index:2}
.bsDino{display:flex;flex-direction:column;align-items:center;border-radius:20px;padding:4px;transition:transform .2s}
.bsDino{min-width:0}
.bsDino b{font-family:var(--display);font-size:clamp(12px,1.8vw,22px);background:rgba(255,255,255,.85);border-radius:10px;padding:0 8px;text-align:center;overflow-wrap:anywhere;line-height:1.1}
.bsDino small{font-size:13px;background:rgba(255,255,255,.7);border-radius:8px;padding:0 6px}
.bsDino.good{background:rgba(223,255,232,.8);box-shadow:0 0 0 5px var(--green)}
.bsKid{display:flex;align-items:flex-end}.bsKid .emo{font-size:clamp(20px,5vh,48px)}
.choice.dq .dinoSvg{width:92%;max-height:70%}
/* time machine */
.tmStage{position:relative;flex:1;min-height:0;border-radius:28px;overflow:hidden;box-shadow:0 10px 24px rgba(34,48,77,.15)}
.tmActors{position:absolute;inset:0;z-index:2}
.tmDino{position:absolute;left:0;top:0;will-change:transform;filter:drop-shadow(0 10px 8px rgba(0,0,0,.2))}
.tmDino .dinoSvg{display:block}
.tmDino{translate:0 -72%;padding:0;background:none}
.tmSign{position:absolute;z-index:3;top:12px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.9);border-radius:18px;padding:6px 18px;text-align:center}
.tmSign b{display:block;font-family:var(--display);font-size:clamp(22px,3.4vw,36px);line-height:1.05}.tmSign small{color:var(--ink2)}
.tmBar{display:flex;gap:8px;overflow-x:auto;flex:none;align-items:center;scrollbar-width:none;padding:2px}.tmBar::-webkit-scrollbar{display:none}
.tmGo{height:56px;padding:0 18px;border-radius:18px;font-family:var(--display);font-size:20px;display:flex;align-items:center;gap:8px;margin-left:auto;flex:none}

/* ===== Baby Care ===== */
.bcSteps{display:flex;align-items:center;justify-content:center;gap:4px;flex:none;flex-wrap:wrap}
.bcSteps i{font-style:normal;color:var(--ink2);opacity:.5}
.bcStep{width:clamp(40px,6vmin,54px);height:clamp(40px,6vmin,54px);border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,3.4vmin,28px);box-shadow:0 3px 0 rgba(34,48,77,.12);transition:transform .25s}
.bcStep.now{background:var(--yellow);transform:scale(1.2);box-shadow:0 0 0 4px #fff,0 0 0 7px var(--yellow)}
.bcStep.done{background:#DFFFE8}.bcStep.done::after{content:"✓";position:absolute;margin:-26px 0 0 26px;font:900 14px var(--body);color:var(--green)}
.bcStage{position:relative;flex:1;min-height:0;border-radius:28px;overflow:hidden;box-shadow:0 10px 24px rgba(34,48,77,.15);touch-action:none;transition:background 1s}
.bc-bath{background:linear-gradient(#DDF4FF 0 62%,#BFE3F5 62%),repeating-linear-gradient(90deg,transparent 0 58px,rgba(255,255,255,.7) 58px 60px),repeating-linear-gradient(0deg,transparent 0 58px,rgba(255,255,255,.7) 58px 60px);background-blend-mode:normal}
.bc-play{background:radial-gradient(ellipse at 50% 120%,#BFF0B0 0 40%,transparent 41%),linear-gradient(#FFF1D6,#FFE3F1)}
.bc-kitchen{background:linear-gradient(#FFF6D8 0 64%,#F2C98A 64%),repeating-linear-gradient(45deg,rgba(255,200,120,.25) 0 20px,transparent 20px 40px)}
.bc-nursery{background:linear-gradient(#E9E2FF 0 66%,#D2C4FA 66%)}
.bcStage.night{background:linear-gradient(#141C47,#2A2F72)}
.bcStage.night .bcBox{filter:brightness(.7) saturate(.8)}
.bcStage.running::before{content:"";position:absolute;left:50%;top:14%;width:18px;margin-left:-9px;height:40%;background:linear-gradient(rgba(120,200,255,.8),rgba(120,200,255,.2));border-radius:9px;animation:drip .3s linear infinite;z-index:3}
@keyframes drip{50%{opacity:.7}}
.bcBox{position:absolute;left:50%;top:50%;height:94%;aspect-ratio:320/400;transform:translate(-50%,-50%);transition:left .8s cubic-bezier(.3,1.3,.5,1),transform .25s;z-index:2}
.bcBox.onPotty{left:70%}
.bcBox #bcArt,.bcBox .babySvg{width:100%;height:100%;display:block}
.bcOver{position:absolute;inset:0;pointer-events:none}
.bcSpot{position:absolute;transform:translate(-50%,-50%);transition:opacity .2s,transform .2s;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.bcSpot.germ{animation:germ 1.4s ease-in-out infinite}
@keyframes germ{50%{margin-top:-4px}}
.bcProps{position:absolute;inset:0;z-index:3;pointer-events:none}
.bcProp{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;filter:drop-shadow(0 8px 6px rgba(0,0,0,.2));line-height:1}

.bcMeter{position:absolute;left:10%;right:10%;bottom:12px;height:14px;border-radius:999px;background:rgba(255,255,255,.7);overflow:hidden;z-index:4}
.bcMeter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--yellow));border-radius:999px;transition:width .15s}
.bcTray{flex:none;display:flex;justify-content:center;gap:clamp(10px,2.5vw,24px);min-height:clamp(76px,12vmin,104px);align-items:center;flex-wrap:wrap}
.bcItem{width:clamp(76px,12vmin,104px);height:clamp(76px,12vmin,104px);border-radius:26px;background:#fff;font-size:clamp(44px,7vmin,64px);box-shadow:0 6px 0 rgba(34,48,77,.14);touch-action:none}
.bcItem.used{opacity:.35}
.bcTool{position:fixed;z-index:90;font-size:clamp(56px,9vmin,84px);transform:translate(-30%,-70%) rotate(-20deg);pointer-events:none;filter:drop-shadow(0 8px 6px rgba(0,0,0,.25))}
.hintPulse{animation:hintP 1.2s ease-in-out infinite!important}
@keyframes hintP{0%,100%{filter:drop-shadow(0 0 0 rgba(255,210,60,0))}50%{filter:drop-shadow(0 0 16px rgba(255,200,40,1)) brightness(1.08)}}
.bcProp.hintPulse{animation:hintP2 1.2s ease-in-out infinite!important}
@keyframes hintP2{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.15);filter:drop-shadow(0 0 18px rgba(255,200,40,1))}}
.floatBtnI{height:64px;padding:0 22px;border-radius:22px;font-family:var(--display);font-size:22px;display:flex;align-items:center;gap:10px}
.bcHead{margin:4px 0 12px}
.bcPick{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}.bcPick::-webkit-scrollbar{display:none}
.bcBaby{flex:none;width:96px;background:#fff;border-radius:22px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;box-shadow:0 4px 0 rgba(34,48,77,.12)}
.bcBaby .mini{width:70px;display:block}.bcBaby .mini svg{width:100%;height:auto}
.bcBaby b{font-family:var(--display);font-size:17px}
.bcBaby.on{box-shadow:0 0 0 4px var(--pink),0 4px 0 rgba(34,48,77,.12);background:#FFF0F7}
.dayBtn{width:100%;display:flex;align-items:center;gap:14px;padding:14px 20px;margin:0 0 16px;text-align:left}
.dayBtn .emo{font-size:48px}.dayBtn b{font-family:var(--display);font-size:clamp(22px,3vw,30px);display:block}.dayBtn small{display:block;opacity:.92;margin-left:auto}
.dayCard{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}

.dayTrack{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

.dayTrack>span.done{opacity:1;background:#DFFFE8}.dayTrack>span.now{opacity:1;background:var(--yellow);transform:scale(1.2)}

/* ===== Story Movies ===== */
#s-story{gap:10px}
.stStage{position:relative;flex:1;min-height:0;border-radius:28px;overflow:hidden;box-shadow:0 10px 26px rgba(34,48,77,.18);touch-action:pan-y}
.stCam{position:absolute;inset:0;transform-origin:50% 60%;will-change:transform}
.stActor{position:absolute;transform:translate(-50%,-50%);font-size:calc(var(--sz) * 1vh * .9);line-height:1;filter:drop-shadow(0 12px 8px rgba(0,0,0,.2));z-index:2}
.stActor .inner{display:block;transform-origin:50% 90%}
.stActor.dino .inner{width:calc(var(--sz) * 1.6vh)}
.stActor.zz::after{content:"💤";position:absolute;right:-30%;top:-30%;font-size:.35em;font-family:var(--emoji);animation:zz 2s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,10px)}50%{opacity:1}100%{opacity:0;transform:translate(10px,-20px)}}
.stActor.hintPulse{animation:hintP 1s ease-in-out infinite!important}
.stFx{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.sfx{position:absolute}

@keyframes sfxFall{from{transform:translateY(-10vh)}to{transform:translateY(80vh) rotate(90deg)}}
@keyframes sfxRise{from{transform:translateY(0);opacity:1}to{transform:translateY(-80vh);opacity:0}}
